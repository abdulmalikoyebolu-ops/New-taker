<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vektra Chat Bot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}

body {
  font-family: 'Inter', sans-serif;
  background: #000;
  color: #f0f0f8;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
}
body.light { background: #f5f5f7; color: #111; }

/* orbs */
.orb { position:fixed; border-radius:50%; filter:blur(100px); opacity:0.07; animation:drift 14s ease-in-out infinite alternate; pointer-events:none; z-index:0; }
.o1 { width:400px;height:400px;background:radial-gradient(circle,#3b82f6,transparent 70%);top:-150px;left:-100px; }
.o2 { width:300px;height:300px;background:radial-gradient(circle,#a855f7,transparent 70%);top:20%;right:-80px;animation-delay:-5s; }
.o3 { width:280px;height:280px;background:radial-gradient(circle,#2dd4bf,transparent 70%);bottom:10%;left:5%;animation-delay:-9s; }
.o4 { width:250px;height:250px;background:radial-gradient(circle,#6366f1,transparent 70%);bottom:-80px;right:20%;animation-delay:-3s; }
@keyframes drift{from{transform:translate(0,0) scale(1);}to{transform:translate(30px,40px) scale(1.1);}}

/* layout */
header {
  width:100%; display:flex; align-items:center; justify-content:center;
  height:58px; border-bottom:1px solid rgba(255,255,255,0.07);
  background:rgba(0,0,0,0.85); backdrop-filter:blur(20px);
  position:relative; z-index:10; flex-shrink:0;
  transition: background 0.3s, border-color 0.3s;
}
body.light header { background:rgba(245,245,247,0.92); border-color:rgba(0,0,0,0.09); }

.h-inner { width:100%; max-width:720px; display:flex; align-items:center; gap:12px; padding:0 18px; }

.logo { width:36px; height:36px; flex-shrink:0; }
.logo img { width:100%; height:100%; object-fit:contain; display:block; }

.h-info { flex:1; }
.h-name { font-size:15px; font-weight:600; }
body.light .h-name { color:#111; }
.h-sub { font-size:11px; color:#70708a; display:flex; align-items:center; gap:5px; margin-top:1px; }
body.light .h-sub { color:#888; }
.dot { width:6px; height:6px; border-radius:50%; background:#22c55e; animation:pulse 2s infinite; }
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

.h-actions { display:flex; align-items:center; gap:8px; }

.ibtn {
  width:34px; height:34px; border-radius:50%;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08);
  color:#70708a; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all 0.2s; flex-shrink:0;
}
body.light .ibtn { background:rgba(0,0,0,0.05); border-color:rgba(0,0,0,0.1); color:#888; }
.ibtn:hover { background:rgba(59,130,246,0.12); border-color:rgba(59,130,246,0.3); color:#3b82f6; }
.ibtn svg { width:16px; height:16px; pointer-events:none; }
.ibtn.rec { background:rgba(239,68,68,0.2); border-color:#ef4444; color:#ef4444; }

/* Recording indicator bar */
#recbar {
  display:none;
  align-items:center; gap:10px;
  padding:8px 14px; margin-bottom:8px;
  background:rgba(239,68,68,0.1);
  border:1px solid rgba(239,68,68,0.3);
  border-radius:16px; color:#ef4444; font-size:13px; font-weight:500;
}
#recbar.show { display:flex; }
.recdot {
  width:10px; height:10px; border-radius:50%; background:#ef4444;
  animation:recpulse 1s infinite; flex-shrink:0;
}
@keyframes recpulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);}}
.rectime { flex:1; }
.recstop {
  background:none; border:1px solid rgba(239,68,68,0.4);
  color:#ef4444; border-radius:12px; padding:4px 10px;
  font-size:11px; cursor:pointer; font-family:inherit;
}
.recstop:hover { background:rgba(239,68,68,0.1); }

/* Image preview modal */
#imgpreview {
  display:none;
  position:fixed; inset:0; z-index:100;
  background:rgba(0,0,0,0.85); backdrop-filter:blur(10px);
  align-items:center; justify-content:center; padding:20px;
}
#imgpreview.show { display:flex; }
.prev-box {
  background:#111; border:1px solid rgba(255,255,255,0.1);
  border-radius:20px; padding:16px; width:100%; max-width:420px;
  display:flex; flex-direction:column; gap:12px;
}
body.light .prev-box { background:#fff; border-color:rgba(0,0,0,0.1); }
.prev-img { width:100%; border-radius:12px; max-height:300px; object-fit:contain; display:block; }
.prev-caption {
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
  border-radius:12px; padding:10px 14px; color:#f0f0f8;
  font-family:inherit; font-size:14px; outline:none; resize:none;
  width:100%;
}
body.light .prev-caption { background:#f5f5f7; border-color:rgba(0,0,0,0.1); color:#111; }
.prev-caption::placeholder { color:#555; }
.prev-actions { display:flex; gap:8px; }
.prev-cancel {
  flex:1; padding:10px; border-radius:12px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
  color:#888; font-family:inherit; font-size:13px; cursor:pointer;
}
body.light .prev-cancel { background:rgba(0,0,0,0.05); border-color:rgba(0,0,0,0.1); }
.prev-send {
  flex:2; padding:10px; border-radius:12px;
  background:linear-gradient(135deg,#3b82f6,#6366f1);
  border:none; color:#fff; font-family:inherit; font-size:13px;
  font-weight:600; cursor:pointer;
}

.cbtn {
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
  color:#70708a; padding:6px 14px; border-radius:20px;
  font-size:12px; font-family:inherit; cursor:pointer; transition:all 0.2s;
}
body.light .cbtn { background:rgba(0,0,0,0.05); border-color:rgba(0,0,0,0.1); }
.cbtn:hover { border-color:rgba(59,130,246,0.4); color:#3b82f6; }

/* messages */
.msgs-wrap { flex:1; overflow:hidden; display:flex; justify-content:center; position:relative; z-index:1; }
#msgs {
  width:100%; max-width:720px; height:100%;
  overflow-y:auto; padding:20px 16px;
  display:flex; flex-direction:column; gap:12px;
  scroll-behavior:smooth;
}
#msgs::-webkit-scrollbar{width:3px;}
#msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px;}

/* welcome */
.welcome {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; flex:1; gap:14px; text-align:center; padding:40px 24px;
  opacity:0; animation:fadein 0.6s ease 0.2s forwards;
}
@keyframes fadein{to{opacity:1;}}
.w-logo { width:80px; height:80px; }
.w-logo img { width:100%; height:100%; object-fit:contain; }
.welcome h2 { font-size:24px; font-weight:700; }
body.light .welcome h2 { color:#111; }
.welcome p { font-size:14px; color:#70708a; line-height:1.7; max-width:300px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:6px; }
.chip {
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  color:#70708a; padding:8px 16px; border-radius:20px;
  font-size:13px; cursor:pointer; transition:all 0.2s; font-family:inherit;
}
body.light .chip { background:#fff; border-color:rgba(0,0,0,0.1); }
.chip:hover { border-color:rgba(59,130,246,0.4); color:#3b82f6; background:rgba(59,130,246,0.06); }

/* bubbles */
.row { display:flex; gap:8px; opacity:0; animation:slideup 0.3s ease forwards; }
.row.user { justify-content:flex-end; }
.row.bot { justify-content:flex-start; }
@keyframes slideup{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.bavatar { width:28px; height:28px; flex-shrink:0; align-self:flex-end; }
.bavatar img { width:100%; height:100%; object-fit:contain; }
.bcol { display:flex; flex-direction:column; gap:2px; max-width:80%; }
.bubble { padding:11px 15px; border-radius:20px; font-size:14px; line-height:1.6; word-break:break-word; }
.row.user .bubble { background:linear-gradient(135deg,#3b82f6,#6366f1); color:#fff; border-bottom-right-radius:5px; }
.row.bot .bubble { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.07); border-bottom-left-radius:5px; }
body.light .row.bot .bubble { background:#fff; border-color:rgba(0,0,0,0.08); color:#111; }
.bubble img { max-width:100%; border-radius:12px; display:block; }
.bubble audio { width:200px; accent-color:#3b82f6; }
.btime { font-size:10px; color:#333350; padding:0 4px; }
body.light .btime { color:#aaa; }
.row.user .btime { text-align:right; }

/* typing */
.typing { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.07); border-radius:20px; border-bottom-left-radius:5px; padding:13px 17px; display:flex; gap:5px; align-items:center; }
body.light .typing { background:#fff; border-color:rgba(0,0,0,0.08); }
.td { width:7px; height:7px; border-radius:50%; background:#333350; animation:tbounce 1.2s infinite; }
body.light .td { background:#aaa; }
.td:nth-child(2){animation-delay:0.2s;} .td:nth-child(3){animation-delay:0.4s;}
@keyframes tbounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-6px);background:#3b82f6;}}

/* footer */
footer {
  width:100%; display:flex; justify-content:center;
  border-top:1px solid rgba(255,255,255,0.07);
  background:rgba(0,0,0,0.85); backdrop-filter:blur(20px);
  position:relative; z-index:10; flex-shrink:0;
  transition: background 0.3s, border-color 0.3s;
}
body.light footer { background:rgba(245,245,247,0.95); border-color:rgba(0,0,0,0.09); }
.f-inner { width:100%; max-width:720px; padding:12px 14px 16px; }
.irow {
  display:flex; align-items:flex-end; gap:8px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.07);
  border-radius:26px; padding:8px 8px 8px 14px; transition:all 0.2s;
}
body.light .irow { background:#fff; border-color:rgba(0,0,0,0.1); }
.irow:focus-within { border-color:rgba(59,130,246,0.4); }
#msginput {
  flex:1; background:none; border:none; outline:none;
  color:#f0f0f8; font-family:inherit; font-size:14px;
  resize:none; max-height:120px; line-height:1.5; padding:3px 0;
}
body.light #msginput { color:#111; }
#msginput::placeholder { color:#333350; }
body.light #msginput::placeholder { color:#aaa; }
#sendbtn {
  width:36px; height:36px; border-radius:50%;
  background:linear-gradient(135deg,#3b82f6,#6366f1);
  border:none; cursor:pointer; color:#fff;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all 0.2s;
}
#sendbtn:hover { transform:scale(1.08); opacity:0.9; }
#sendbtn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
#sendbtn svg { width:15px; height:15px; pointer-events:none; }
.powered { text-align:center; font-size:10px; color:#333350; margin-top:8px; }
body.light .powered { color:#aaa; }
.powered span { background:linear-gradient(90deg,#3b82f6,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
#imginput { display:none; }
</style>
</head>

      </button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>

      </button>

<script>
var API = 'https://vektrastudio-bot.onrender.com';
var SID = 'web_' + Math.random().toString(36).slice(2, 9);
var busy = false;
var recording = false;
var recorder = null;
var chunks = [];
var isLight = localStorage.getItem('vtheme') === 'light';

var inp = document.getElementById('msginput');
var sbtn = document.getElementById('sendbtn');
var msgs = document.getElementById('msgs');
var micbtn = document.getElementById('micbtn');
var themebtn = document.getElementById('themebtn');

// apply saved theme
if (isLight) {
  document.body.classList.add('light');
  themebtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
}

inp.addEventListener('input', function() {
  sbtn.disabled = !inp.value.trim() || busy;
});

function resizeInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sbtn.disabled) sendMsg();
  }
}

function getTime() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function getLogo() {
  return document.getElementById('logoimg').src;
}

function hideWelcome() {
  var w = document.getElementById('welcome');
  if (w) w.style.display = 'none';
}

function addMsg(text, role, html) {
  hideWelcome();
  var row = document.createElement('div');
  row.className = 'row ' + role;

  if (role === 'bot') {
    var av = document.createElement('div');
    av.className = 'bavatar';
    av.innerHTML = '<img src="' + getLogo() + '" alt="V"/>';
    row.appendChild(av);
  }

  var col = document.createElement('div');
  col.className = 'bcol';
  var bub = document.createElement('div');
  bub.className = 'bubble';
  if (html) bub.innerHTML = html;
  else bub.textContent = text;
  var t = document.createElement('div');
  t.className = 'btime';
  t.textContent = getTime();
  col.appendChild(bub);
  col.appendChild(t);
  row.appendChild(col);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  hideWelcome();
  var row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'typing';
  var av = document.createElement('div');
  av.className = 'bavatar';
  av.innerHTML = '<img src="' + getLogo() + '" alt="V"/>';
  row.appendChild(av);
  var bub = document.createElement('div');
  bub.className = 'typing';
  bub.innerHTML = '<div class="td"></div><div class="td"></div><div class="td"></div>';
  row.appendChild(bub);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function hideTyping() {
  var t = document.getElementById('typing');
  if (t) t.remove();
}

function toggleTheme() {
  isLight = !isLight;
  localStorage.setItem('vtheme', isLight ? 'light' : 'dark');
  if (isLight) {
    document.body.classList.add('light');
    themebtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  } else {
    document.body.classList.remove('light');
    themebtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  }
}

async function sendMsg(text) {
  var msg = text || inp.value.trim();
  if (!msg || busy) return;
  inp.value = '';
  inp.style.height = 'auto';
  sbtn.disabled = true;
  busy = true;
  addMsg(msg, 'user');
  showTyping();
  try {
    var res = await fetch(API + '/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg, sessionId: SID})
    });
    var data = await res.json();
    hideTyping();
    addMsg(data.reply || data.error || 'Something went wrong!', 'bot');
  } catch(e) {
    hideTyping();
    addMsg('Server is waking up, please wait 30 seconds and try again!', 'bot');
  }
  busy = false;
  sbtn.disabled = !inp.value.trim();
  inp.focus();
}

function quickSend(text) {
  sendMsg(text);
}

var pendingFile = null;

function sendImage(event) {
  var file = event.target.files[0];
  if (!file) return;
  event.target.value = '';
  pendingFile = file;
  var url = URL.createObjectURL(file);
  document.getElementById('previmg').src = url;
  document.getElementById('prevcaption').value = '';
  document.getElementById('imgpreview').classList.add('show');
}

function cancelPreview() {
  document.getElementById('imgpreview').classList.remove('show');
  pendingFile = null;
}

async function confirmSendImage() {
  if (!pendingFile) return;
  var file = pendingFile;
  var caption = document.getElementById('prevcaption').value.trim();
  var url = document.getElementById('previmg').src;
  document.getElementById('imgpreview').classList.remove('show');
  pendingFile = null;

  var html = '<img src="' + url + '" alt="img" style="max-width:100%;border-radius:12px;display:block;"/>';
  if (caption) html += '<div style="margin-top:6px;font-size:13px;">' + caption + '</div>';
  addMsg('', 'user', html);
  showTyping();
  busy = true;
  sbtn.disabled = true;

  var reader = new FileReader();
  reader.onload = async function(e) {
    var b64 = e.target.result.split(',')[1];
    try {
      var res = await fetch(API + '/vision', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({image: b64, mimeType: file.type, caption: caption, sessionId: SID})
      });
      var data = await res.json();
      hideTyping();
      addMsg(data.reply || 'Could not analyze image.', 'bot');
    } catch(e) {
      hideTyping();
      addMsg('Could not reach server. Try again!', 'bot');
    }
    busy = false;
    sbtn.disabled = !inp.value.trim();
  };
  reader.readAsDataURL(file);
}

var recInterval = null;
var recSeconds = 0;

async function toggleMic() {
  if (!recording) {
    try {
      var stream = await navigator.mediaDevices.getUserMedia({audio: true});
      chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = function(e) { chunks.push(e.data); };
      recorder.onstop = async function() {
        clearInterval(recInterval);
        document.getElementById('recbar').classList.remove('show');
        stream.getTracks().forEach(function(t) { t.stop(); });
        var blob = new Blob(chunks, {type: 'audio/webm'});
        var audioUrl = URL.createObjectURL(blob);
        addMsg('', 'user', '<audio controls src="' + audioUrl + '" style="width:220px;accent-color:#3b82f6;border-radius:8px;"></audio>');
        showTyping();
        busy = true;
        sbtn.disabled = true;
        var reader = new FileReader();
        reader.onload = async function(e) {
          var b64 = e.target.result.split(',')[1];
          try {
            var res = await fetch(API + '/voice', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({audio: b64, mimeType: 'audio/webm', sessionId: SID})
            });
            var data = await res.json();
            hideTyping();
            addMsg(data.reply || 'Could not process voice.', 'bot');
          } catch(e) {
            hideTyping();
            addMsg('Could not reach server. Try again!', 'bot');
          }
          busy = false;
          sbtn.disabled = !inp.value.trim();
        };
        reader.readAsDataURL(blob);
      };
      recorder.start();
      recording = true;
      micbtn.classList.add('rec');
      // Show recording bar with timer
      recSeconds = 0;
      document.getElementById('rectime').textContent = 'Recording... 0:00';
      document.getElementById('recbar').classList.add('show');
      recInterval = setInterval(function() {
        recSeconds++;
        var m = Math.floor(recSeconds / 60);
        var s = recSeconds % 60;
        document.getElementById('rectime').textContent = 'Recording... ' + m + ':' + (s < 10 ? '0' : '') + s;
      }, 1000);
    } catch(e) {
      alert('Microphone access denied. Please allow microphone access.');
    }
  } else {
    recorder.stop();
    recording = false;
    micbtn.classList.remove('rec');
  }
}

function clearChat() {
  fetch(API + '/clear', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({sessionId: SID})}).catch(function(){});
  msgs.innerHTML = '';
  var w = document.createElement('div');

}
