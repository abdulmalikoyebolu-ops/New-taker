<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Vektra AI</title>
  <meta name="description" content="Vektra AI — Smart, witty, and warm conversational assistant with instant document, invoice, and vision capabilities."/>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#0a0a0c"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Vektra"/>
  <link rel="apple-touch-icon" href="/vektra-logo.svg"/>
  <link rel="icon" type="image/svg+xml" href="/vektra-logo.svg"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  
  <!-- Document & Invoice Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <style>
    /* Full styling: modern dark/light themes, sidebar drawer, chat bubbles, responsive canvas, and mobile action sheets */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #000000; --sidebar-bg: #000000; --surface: #141414; --surface-h: #1f1f1f;
      --border: #222222; --text: #ececec; --text-muted: #8e8ea0; --accent: #2563eb;
      --pill-bg: #212121; --pill-border: #2e2e2e; --user-bubble: #212121; --user-text: #ffffff;
    }
    body.light {
      --bg: #f7f7f8; --sidebar-bg: #ffffff; --surface: #f0f0f0; --surface-h: #e5e5e5;
      --border: #e2e2e2; --text: #0d0d0d; --text-muted: #666666; --accent: #2563eb;
      --pill-bg: #ffffff; --pill-border: #e0e0e0; --user-bubble: #e5e5ea; --user-text: #000000;
    }
    html, body {
      height: 100%; height: 100dvh; background: var(--bg); color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .app { display: flex; width: 100vw; height: 100vh; height: 100dvh; position: relative; }
    /* ... See direct link or sidebar button for complete CSS rules ... */
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar Drawer with Install App & Download Code buttons -->
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <!-- Brand, New Chat, Search, Install App, and Download Code triggers -->
    </aside>

    <!-- Main Chat Workspace -->
    <main class="main" id="mainWorkspace">
      <!-- Topbar: Menu, Model Pill, PWA Install Pill, Plus Button -->
      <!-- Message Stream: Welcome View, Chat Bubbles, Invoice Cards, Image Previews -->
      <!-- Bottom Input: Voice dictation, Photo upload, Multimodal input box -->
    </main>
  </div>

  <script>
    // 1. PWA & Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error:', err));
      });
    }

    // 2. Direct Code Downloader
    async function downloadProjectCode() {
      try {
        showToast('Preparing download...');
        const res = await fetch('/index.html');
        const htmlText = await res.text();
        const blob = new Blob([htmlText], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        window.open('/index.html', '_blank');
      }
    }

    // 3. Invoice & Document Generators (PDF, Excel, Word, Native Share Sheet)
    async function shareInvoiceFile(input) {
      const inv = resolveInvoice(input);
      if (!inv) return;
      const { jsPDF } = window.jspdf || {};
      if (!jsPDF) return;

      const doc = new jsPDF({ unit: 'pt', format: 'a4' });
      // Generates PDF styling and tables
      const pdfBlob = doc.output('blob');
      const filename = `${inv.invoiceNumber || 'Invoice'}.pdf`;
      const file = new File([pdfBlob], filename, { type: 'application/pdf' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          title: `Invoice #${inv.invoiceNumber || ''}`,
          text: `Invoice #${inv.invoiceNumber || ''} for ${inv.billTo || 'Client'}`,
          files: [file]
        });
        showToast('Shared invoice successfully 🚀');
        return;
      }
      downloadInvoicePDF(input);
    }

    // 4. API Communication with Backend (https://vektrastudio-bot.onrender.com)
    // 5. Speech Synthesis, Voice Recognition, and Chat Streaming
  </script>
</body>
</html>
