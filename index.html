<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Vektra AI — Next-Gen Intelligence Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #09090b; --surface: #121217; --border: rgba(255,255,255,0.08);
      --border-focus: rgba(147,51,234,0.5); --text: #f4f4f7; --text-muted: #8e8ea0;
      --text-dim: #5c5c70; --accent: #7c3aed; --accent-glow: rgba(124,58,237,0.3);
      --dock: rgba(18,18,23,0.9); --bot-bubble: #14141d;
    }
    body.light {
      --bg: #f8f9fc; --surface: #ffffff; --border: rgba(0,0,0,0.08);
      --border-focus: rgba(124,58,237,0.4); --text: #0f172a; --text-muted: #64748b;
      --text-dim: #94a3b8; --dock: rgba(255,255,255,0.95); --bot-bubble: #ffffff;
    }
    html, body {
      height: 100%; height: 100dvh; font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg); color: var(--text); overflow: hidden;
      transition: background .25s ease, color .25s ease;
    }
    .flare {
      position: fixed; top: -20%; left: 50%; transform: translateX(-50%);
      width: 700px; height: 500px; background: radial-gradient(circle, rgba(124,58,237,0.12) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .app { display: flex; width: 100vw; height: 100vh; height: 100dvh; position: relative; z-index: 1; }
    .sb {
      width: 260px; shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 50; transition: transform .3s cubic-bezier(0.16,1,0.3,1);
    }
    @media(max-width: 768px) {
      .sb { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); }
      .sb.open { transform: translateX(0); }
      .sb-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 45; }
      .sb-mask.active { display: block; }
    }
    .brand { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 12px; }
    .brand-id { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
    .logo-sq {
      width: 30px; height: 30px; border-radius: 9px; background: rgba(124,58,237,0.2);
      border: 1px solid rgba(124,58,237,0.3); display: flex; align-items: center; justify-content: center;
    }
    .logo-sq img { width: 18px; height: 18px; }
    .new-btn {
      margin: 4px 12px 10px; padding: 10px 14px; border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #6366f1); border: none; color: #fff;
      font-weight: 600; font-size: 13.5px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px; box-shadow: 0 4px 14px var(--accent-glow); transition: all .2s;
    }
    .new-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,58,237,0.45); }
    .nav { list-style: none; padding: 0 10px; display: flex; flex-direction: column; gap: 2px; }
    .nav-btn {
      width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      border-radius: 10px; border: none; background: transparent; color: var(--text-muted);
      font-size: 13.5px; font-weight: 500; cursor: pointer; transition: all .15s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav-btn.active { background: rgba(124,58,237,0.12); color: #c084fc; font-weight: 600; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; height: 100%; }
    .topbar {
      height: 56px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; border-bottom: 1px solid var(--border); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px); z-index: 20; shrink: 0;
    }
    .model-pill {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border); font-size: 12.5px;
      font-weight: 600; color: var(--text);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.7); }
    .btn-circle {
      width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); color: var(--text-muted); display: flex; align-items: center;
      justify-content: center; cursor: pointer; transition: all .2s;
    }
    .btn-circle:hover { background: rgba(255,255,255,0.08); color: var(--text); transform: scale(1.05); }
    .chat-view { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 110px; }
    .chat-flow { width: 100%; max-width: 740px; display: flex; flex-direction: column; gap: 20px; }
    .welcome { display: flex; flex-direction: column; align-items: center; text-align: center; margin: auto 0; padding: 40px 12px 20px; }
    .w-logo {
      width: 64px; height: 64px; border-radius: 20px; background: rgba(124,58,237,0.18);
      border: 1px solid rgba(124,58,237,0.35); box-shadow: 0 10px 30px rgba(124,58,237,0.3);
      display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
    }
    .w-logo img { width: 36px; height: 36px; }
    .w-title { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; }
    .w-sub { font-size: 14.5px; color: var(--text-muted); max-width: 440px; line-height: 1.6; margin-bottom: 30px; }
    .bento { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 640px; }
    @media(max-width: 600px) { .bento { grid-template-columns: 1fr; } }
    .card {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; text-align: left; cursor: pointer; display: flex; flex-direction: column;
      justify-content: space-between; height: 118px; transition: all .2s; font-family: inherit;
    }
    .card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.06); border-color: rgba(124,58,237,0.4); }
    .msg-row { display: flex; gap: 12px; opacity: 0; animation: msgIn .25s ease forwards; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg-row.user { justify-content: flex-end; }
    .bot-av {
      width: 32px; height: 32px; border-radius: 10px; background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.3); display: flex; align-items: center; justify-content: center; shrink: 0;
    }
    .bot-av img { width: 18px; height: 18px; }
    .msg-col { display: flex; flex-direction: column; max-width: 82%; }
    .msg-row.user .msg-col { align-items: flex-end; }
    .bubble { padding: 12px 18px; border-radius: 18px; font-size: 14.5px; line-height: 1.6; word-break: break-word; }
    .msg-row.user .bubble { background: linear-gradient(135deg, #7c3aed, #6366f1); color: #fff; border-bottom-right-radius: 4px; }
    .msg-row.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .code-box { margin: 10px 0; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); background: #0c0d13; }
    .code-top { display: flex; justify-content: space-between; padding: 6px 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; background: rgba(255,255,255,0.04); color: var(--text-dim); }
    .code-pre { padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; overflow-x: auto; color: #e2e8f0; }
    .dock-area {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 0 16px 18px;
      display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 30;
    }
    .dock-inner { width: 100%; max-width: 680px; pointer-events: auto; }
    .dock {
      background: var(--dock); border: 1px solid var(--border); border-radius: 22px;
      padding: 8px 10px 8px 16px; display: flex; flex-direction: column; gap: 6px;
      backdrop-filter: blur(24px); box-shadow: 0 16px 40px rgba(0,0,0,0.35); transition: border-color .2s;
    }
    .dock:focus-within { border-color: var(--border-focus); }
    .dock-row { display: flex; align-items: flex-end; gap: 8px; }
    #chatInput {
      flex: 1; background: transparent; border: none; outline: none; color: var(--text);
      font-family: inherit; font-size: 14.5px; line-height: 1.5; resize: none; max-height: 150px; padding: 6px 0;
    }
    .send-btn {
      width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: none;
      color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 4px 12px rgba(124,58,237,0.5); transition: transform .2s; shrink: 0;
    }
    .send-btn:hover { transform: scale(1.08); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
    .chips { display: flex; gap: 6px; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.05); }
    .chip {
      padding: 3px 9px; border-radius: 7px; background: transparent; border: 1px solid transparent;
      color: var(--text-muted); font-size: 11.5px; cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .chip:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .chip.active { background: rgba(124,58,237,0.15); border-color: rgba(124,58,237,0.35); color: #c084fc; font-weight: 600; }
  </style>
</head>
<body>
<div class="flare"></div>
<div class="sb-mask" id="sbMask" onclick="closeSidebar()"></div>

<div class="app">
  <aside class="sb" id="sb">
    <div class="brand">
      <div class="brand-id">
        <div class="logo-sq">
          <img src="https://api.iconify.design/lucide:sparkles.svg?color=%23c084fc" alt="V"/>
        </div>
        <span>Vektra AI</span>
      </div>
    </div>
    <button class="new-btn" onclick="newChat()">+ New Chat</button>
    <ul class="nav">
      <li><button class="nav-btn active">Chat Workspace</button></li>
      <li><button class="nav-btn">Projects & Prompts</button></li>
      <li><button class="nav-btn">Autonomous Agents</button></li>
    </ul>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="model-pill">
          <div class="dot"></div>
          <span>Vektra Omni 3.5</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn-circle" onclick="toggleTheme()" title="Theme">◐</button>
      </div>
    </header>

    <div class="chat-view" id="chatView">
      <div class="chat-flow" id="chatFlow">
        <div class="welcome" id="welcome">
          <div class="w-logo">
            <img src="https://api.iconify.design/lucide:bot.svg?color=%23c084fc" alt="Vektra"/>
          </div>
          <h1 class="w-title">Where should we focus today?</h1>
          <p class="w-sub">Synthesize software, audit complex visual documents, execute live web intelligence, or articulate ideas through voice.</p>
          <div class="bento">
            <button class="card" onclick="quickSend('Summarize the top AI engineering breakthroughs this week')">
              <span style="font-weight:700;font-size:14px;">Web Intelligence</span>
              <span style="font-size:12px;color:var(--text-muted);">Live web search & multi-source synthesis</span>
            </button>
            <button class="card" onclick="quickSend('Architect a clean type-safe distributed queue in TypeScript')">
              <span style="font-weight:700;font-size:14px;">Engineering Core</span>
              <span style="font-size:12px;color:var(--text-muted);">Type-safe systems & algorithmic design</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="dock-area">
      <div class="dock-inner">
        <div class="dock">
          <div class="dock-row">
            <textarea id="chatInput" rows="1" placeholder="Ask Vektra anything..." oninput="autoGrow(this)" onkeydown="onKey(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>→</button>
          </div>
          <div class="chips">
            <button class="chip" id="webChip" onclick="this.classList.toggle('active')">Web Grounding</button>
            <button class="chip" id="thinkChip" onclick="this.classList.toggle('active')">Deep Reasoning</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  const API = 'https://vektrastudio-bot.onrender.com';
  const SESS = 'sess_' + Math.random().toString(36).slice(2, 9);
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatFlow = document.getElementById('chatFlow');
  const chatView = document.getElementById('chatView');

  input.addEventListener('input', () => {
    sendBtn.disabled = !input.value.trim();
  });

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 150) + 'px';
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  }

  function toggleTheme() {
    const isDark = document.documentElement.classList.toggle('dark');
    document.body.classList.toggle('light', !isDark);
  }

  function renderMD(text) {
    return text
      .replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, '<div class="code-box"><div class="code-top">$1</div><pre class="code-pre"><code>$2</code></pre></div>')
      .replace(/^### (.*$)/gim, '<h4 style="font-size:15px;margin:8px 0;">$1</h4>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,0.08);padding:2px 5px;border-radius:4px;font-family:monospace;font-size:12px;">$1</code>');
  }

  function append(text, role) {
    const w = document.getElementById('welcome');
    if (w) w.style.display = 'none';

    const row = document.createElement('div');
    row.className = 'msg-row ' + role;
    if (role === 'bot') {
      row.innerHTML = `<div class="bot-av"><img src="https://api.iconify.design/lucide:sparkles.svg?color=%23c084fc"/></div>
        <div class="msg-col"><div class="bubble">${renderMD(text)}</div></div>`;
    } else {
      row.innerHTML = `<div class="msg-col"><div class="bubble">${text}</div></div>`;
    }
    chatFlow.appendChild(row);
    chatView.scrollTop = chatView.scrollHeight;
  }

  async function sendMessage(preset) {
    const text = preset || input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    append(text, 'user');

    try {
      const res = await fetch(API + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId: SESS })
      });
      const data = await res.json();
      append(data.reply || 'Analysis complete.', 'bot');
    } catch (_) {
      append(`### Strategic Synthesis\nAnalyzing **"${text}"**:\n- **Focus**: Eliminate decision friction while maintaining high structural clarity.\n- **Render Status**: The backend server is spinning up. Ready for next prompt.`, 'bot');
    }
    sendBtn.disabled = !input.value.trim();
  }

  function quickSend(txt) { sendMessage(txt); }
  function newChat() {
    chatFlow.innerHTML = '';
    document.getElementById('welcome').style.display = 'flex';
  }
</script>
</body>
</html>
