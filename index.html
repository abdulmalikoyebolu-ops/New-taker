<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vektra Chat Bot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080810;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.08);
    --blue: #3b82f6;
    --text: #f0f0f8;
    --text-muted: #7070a0;
    --text-dim: #3a3a5a;
    --radius: 20px;
  }

  /* Light theme */
  body.light {
    --bg: #f5f5f7;
    --border: rgba(0,0,0,0.09);
    --text: #111111;
    --text-muted: #666680;
    --text-dim: #aaaaaa;
  }
  body.light .orb { opacity: 0.05; }
  body.light header { background: rgba(245,245,247,0.92); }
  body.light footer { background: rgba(245,245,247,0.95); }
  body.light .msg-row.bot .bubble { background: #ffffff; color: #111111; }
  body.light .input-row { background: #ffffff; }
  body.light #input { color: #111111; }
  body.light #input::placeholder { color: #aaaaaa; }
  body.light .suggestion { background: #ffffff; color: #555577; }
  body.light .typing-bubble { background: #ffffff; }
  body.light .welcome h2 { color: #111111; }
  body.light .header-name { color: #111111; }
  body.light body::before { background-image: linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px); }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* animated bg orbs */
  .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.16; animation: drift 14s ease-in-out infinite alternate; }
  .orb-1 { width: 550px; height: 550px; background: radial-gradient(circle, #3b82f6, transparent 70%); top: -180px; left: -120px; animation-duration: 15s; }
  .orb-2 { width: 420px; height: 420px; background: radial-gradient(circle, #a855f7, transparent 70%); top: 15%; right: -120px; animation-duration: 11s; animation-delay: -5s; }
  .orb-3 { width: 380px; height: 380px; background: radial-gradient(circle, #2dd4bf, transparent 70%); bottom: 5%; left: 5%; animation-duration: 17s; animation-delay: -9s; }
  .orb-4 { width: 320px; height: 320px; background: radial-gradient(circle, #6366f1, transparent 70%); bottom: -80px; right: 15%; animation-duration: 12s; animation-delay: -3s; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(35px,45px) scale(1.1); } }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none; z-index: 0;
  }

  header, #messages, footer { position: relative; z-index: 1; }

  /* header */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,8,16,0.75);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    flex-shrink: 0;
  }

  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .header-info { flex: 1; }
  .header-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .header-status { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-top: 1px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  .clear-btn {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    color: var(--text-muted); padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-family: inherit; cursor: pointer; transition: all 0.2s;
  }
  .clear-btn:hover { border-color: rgba(59,130,246,0.4); color: #3b82f6; background: rgba(59,130,246,0.07); }

  /* messages */
  #messages-wrap {
    flex: 1;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }
  #messages {
    width: 100%;
    max-width: 720px;
    height: 100%;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

  /* welcome */
  .welcome {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; flex: 1; gap: 14px; text-align: center;
    padding: 40px 24px;
    opacity: 0; animation: fadeIn 0.6s ease 0.2s forwards;
  }
  .welcome-logo {
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    padding: 14px;
  }
  .welcome-logo img { width: 100%; height: 100%; object-fit: contain; }
  .welcome h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .welcome p { font-size: 13px; color: var(--text-muted); line-height: 1.7; max-width: 280px; }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
  .suggestion {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    color: var(--text-muted); padding: 8px 16px; border-radius: 20px;
    font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .suggestion:hover { border-color: rgba(59,130,246,0.4); color: #3b82f6; background: rgba(59,130,246,0.06); }

  /* bubbles */
  .msg-row { display: flex; gap: 8px; opacity: 0; animation: slideUp 0.3s ease forwards; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.bot { justify-content: flex-start; }
  @keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    overflow: hidden; flex-shrink: 0; align-self: flex-end;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    padding: 4px;
  }
  .msg-avatar img { width: 100%; height: 100%; object-fit: contain; }

  .bubble { max-width: 78%; padding: 11px 15px; border-radius: var(--radius); font-size: 14px; line-height: 1.6; word-break: break-word; }
  .msg-row.user .bubble { background: linear-gradient(135deg,#3b82f6,#6366f1); color:#fff; border-bottom-right-radius:5px; }
  .msg-row.bot .bubble { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius:5px; backdrop-filter: blur(10px); }

  .bubble img.chat-img { max-width:100%; border-radius:12px; display:block; margin-bottom:4px; }
  .bubble audio { width:100%; margin-bottom:2px; accent-color:#3b82f6; }

  .msg-time { font-size: 10px; color: var(--text-dim); margin-top: 3px; padding: 0 4px; }
  .msg-row.user .msg-time { text-align: right; }

  /* typing */
  .typing-bubble {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    border-radius: var(--radius); border-bottom-left-radius:5px;
    padding: 13px 17px; display: flex; gap: 5px; align-items: center;
    backdrop-filter: blur(10px);
  }
  .typing-dot { width:7px; height:7px; border-radius:50%; background: var(--text-dim); animation: typingBounce 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-6px); background:#3b82f6; } }

  /* footer */
  footer {
    padding: 12px 14px 16px;
    border-top: 1px solid var(--border);
    background: rgba(8,8,16,0.8);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    flex-shrink: 0;
  }

  .input-row {
    display: flex; align-items: flex-end; gap: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    border-radius: 26px; padding: 8px 8px 8px 14px; transition: all 0.2s;
  }
  .input-row:focus-within { border-color: rgba(59,130,246,0.35); background: rgba(255,255,255,0.07); }

  #input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: inherit; font-size: 14px;
    resize: none; max-height: 120px; line-height: 1.5; padding: 3px 0;
  }
  #input::placeholder { color: var(--text-dim); }

  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s; color: var(--text-muted);
  }
  .icon-btn:hover { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.3); color: #3b82f6; }
  .icon-btn.recording { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.4); color:#ef4444; animation: recPulse 1s infinite; }
  @keyframes recPulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  .icon-btn svg { width:16px; height:16px; }

  #send-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg,#3b82f6,#6366f1);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s; color:#fff;
  }
  #send-btn:hover { transform: scale(1.08); opacity:0.9; }
  #send-btn:disabled { background: rgba(255,255,255,0.07); cursor:not-allowed; transform:none; }
  #send-btn svg { width:15px; height:15px; }

  .powered { text-align:center; font-size:10px; color:var(--text-dim); margin-top:8px; }
  .powered span { background: linear-gradient(90deg,#3b82f6,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  #img-input { display:none; }
  @keyframes fadeIn { to { opacity:1; } }
  @media (max-width:480px) { .bubble { max-width:88%; } }
</style>
</head>

<script>
  const BACKEND_URL = 'https://vektrastudio-bot.onrender.com';
  const LOGO_SRC = document.getElementById('vektra-logo').src;
  const sessionId = 'web_' + Math.random().toString(36).slice(2, 9);
  let isTyping = false;
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const messagesEl = document.getElementById('messages');
  const micBtn = document.getElementById('mic-btn');

  input.addEventListener('input', () => { sendBtn.disabled = !inputEl.value.trim() || isTyping; });

  function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight,120)+'px'; }
  function handleKey(e) { if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); if(!sendBtn.disabled) sendMessage(); } }
  function getTime() { return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
  function hideWelcome() { const w=document.getElementById('welcome'); if(w) w.style.display='none'; }

  function makeBotAvatar() {
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.innerHTML = '<img src="' + LOGO_SRC + '" alt="V"/>';
    return av;
  }

  function addMessage(text, role, extraHTML) {
    hideWelcome();
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;
    if (role === 'bot') row.appendChild(makeBotAvatar());
    const col = document.createElement('div');
    col.style.cssText = 'display:flex;flex-direction:column;gap:2px;max-width:80%';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (extraHTML) bubble.innerHTML = extraHTML;
    else bubble.textContent = text;
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = getTime();
    col.appendChild(bubble);
    col.appendChild(time);
    row.appendChild(col);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function showTyping() {
    hideWelcome();
    const row = document.createElement('div');
    row.className = 'msg-row bot'; row.id = 'typing-row';
    row.appendChild(makeBotAvatar());
    const b = document.createElement('div');
    b.className = 'typing-bubble';
    b.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    row.appendChild(b);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function removeTyping() { const el=document.getElementById('typing-row'); if(el) el.remove(); }
  function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  async function sendMessage(text) {
    const msg = text || inputEl.value.trim();
    if (!msg || isTyping) return;
    inputEl.value = ''; inputEl.style.height = 'auto';
    sendBtn.disabled = true; isTyping = true;
    addMessage(msg, 'user');
    showTyping();
    try {
      const res = await fetch(BACKEND_URL+'/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:msg, sessionId}) });
      const data = await res.json();
      removeTyping();
      addMessage(data.reply || data.error || 'Something went wrong!', 'bot');
    } catch(e) {
      removeTyping();
      addMessage('Could not reach the server. It might be waking up — try again in a moment! 😅', 'bot');
    }
    isTyping = false; sendBtn.disabled = !inputEl.value.trim(); inputEl.focus();
  }

  async function handleImageUpload(event) {
    const file = event.target.files[0]; if (!file) return;
    event.target.value = '';
    const reader = new FileReader();
    reader.onload = async (e) => {
      const dataUrl = e.target.result;
      const base64 = dataUrl.split(',')[1];
      addMessage('', 'user', '<img class="chat-img" src="'+dataUrl+'" alt="uploaded"/>');
      showTyping(); isTyping = true; sendBtn.disabled = true;
      try {
        const res = await fetch(BACKEND_URL+'/vision', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({image:base64, mimeType:file.type, caption:'', sessionId}) });
        const data = await res.json();
        removeTyping();
        addMessage(data.reply || data.error || 'Could not analyze image.', 'bot');
      } catch(err) {
        removeTyping();
        addMessage('Could not reach the server to analyze the image 😅', 'bot');
      }
      isTyping = false; sendBtn.disabled = !inputEl.value.trim();
    };
    reader.readAsDataURL(file);
  }

  async function toggleRecording() {
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(audioChunks, {type:'audio/webm'});
          const audioUrl = URL.createObjectURL(blob);
          addMessage('', 'user', '<audio controls src="'+audioUrl+'"></audio>');
          showTyping(); isTyping = true; sendBtn.disabled = true;
          const reader = new FileReader();
          reader.onload = async (e) => {
            const base64 = e.target.result.split(',')[1];
            try {
              const res = await fetch(BACKEND_URL+'/voice', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({audio:base64, mimeType:'audio/webm', sessionId}) });
              const data = await res.json();
              removeTyping();
              addMessage(data.reply || data.error || 'Could not process voice.', 'bot');
            } catch(err) {
              removeTyping();
              addMessage('Could not reach the server 😅', 'bot');
            }
            isTyping = false; sendBtn.disabled = !inputEl.value.trim();
          };
          reader.readAsDataURL(blob);
        };
        mediaRecorder.start();
        isRecording = true; micBtn.classList.add('recording'); micBtn.title = 'Stop recording';
      } catch(err) {
        alert('Microphone access denied. Please allow microphone access to send voice messages.');
      }
    } else {
      mediaRecorder.stop(); isRecording = false;
      micBtn.classList.remove('recording'); micBtn.title = 'Voice message';
    }
  }

  function sendSuggestion(btn) { sendMessage(btn.textContent.replace(/[^␀-À-ɏ]/g,'').trim()); }

  async function clearChat() {
    try { await fetch(BACKEND_URL+'/clear', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({sessionId})}); } catch(e) {}
    messagesEl.innerHTML = '';
    const w = document.createElement('div');
    w.className='welcome'; w.id='welcome'; w.style.opacity='1';
    w.innerHTML = `
      <div class="welcome-logo"><img src="${LOGO_SRC}" alt="Vektra"/></div>
      <h2>Hey, I'm Vektra</h2>
      <p>Your personal AI assistant. Chat, search the web, send images or voice messages — I've got you.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="sendSuggestion(this)">How far 👋</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Search latest news online</button>
        <button class="suggestion" onclick="sendSuggestion(this)">What can you do?</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Tell me something interesting</button>
      </div>`;
    messagesEl.appendChild(w);
  }
</script>
</body>
