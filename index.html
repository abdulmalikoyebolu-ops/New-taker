<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Vektra AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #000000; --sidebar-bg: #000000; --surface: #141414; --surface-h: #1f1f1f;
      --border: #222222; --text: #ececec; --text-muted: #8e8ea0; --accent: #2563eb;
      --pill-bg: #212121; --pill-border: #2e2e2e; --user-bubble: #212121; --user-text: #ffffff;
    }
    body.light {
      --bg: #f7f7f8; --sidebar-bg: #ffffff; --surface: #f0f0f0; --surface-h: #e5e5e5;
      --border: #e2e2e2; --text: #0d0d0d; --text-muted: #666666; --accent: #2563eb;
      --pill-bg: #ffffff; --pill-border: #e0e0e0; --user-bubble: #e5e5ea; --user-text: #000000;
    }
    html, body {
      height: 100%; height: 100dvh; background: var(--bg); color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; overflow: hidden;
      -webkit-font-smoothing: antialiased; transition: background .2s, color .2s;
    }
    .app { display: flex; width: 100vw; height: 100vh; height: 100dvh; position: relative; }

    /* ─── SIDEBAR DRAWER (Zero shadow leaks on left edge!) ─── */
    .drawer-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px); z-index: 90; transition: opacity .3s;
    }
    .drawer-backdrop.active { display: block; }
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; width: 280px; max-width: 85vw;
      background: var(--sidebar-bg); border-right: 1px solid var(--border); z-index: 100;
      display: flex; flex-direction: column; transform: translateX(-100%);
      visibility: hidden; pointer-events: none; box-shadow: none;
      transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1), visibility .3s, background .2s;
    }
    .sidebar.open {
      transform: translateX(0);
      visibility: visible; pointer-events: auto;
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }
    .sb-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 18px 12px;
    }
    .sb-brand { display: flex; align-items: center; gap: 9px; }
    .sb-logo-box {
      width: 28px; height: 28px; border-radius: 7px; background: #212121;
      border: 1px solid #333; display: flex; align-items: center; justify-content: center; padding: 4px;
    }
    .sb-logo-box img { width: 100%; height: 100%; object-fit: contain; }
    .sb-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
    .sb-search-btn {
      width: 36px; height: 36px; border-radius: 50%; background: var(--surface);
      border: none; color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s;
    }
    .sb-search-btn:hover { background: var(--surface-h); }
    .sb-nav-list { display: flex; flex-direction: column; padding: 4px 10px; gap: 2px; }
    .sb-nav-item {
      display: flex; align-items: center; gap: 14px; padding: 9px 12px; border-radius: 12px;
      color: var(--text); font-size: 15px; font-weight: 500; text-decoration: none;
      background: none; border: none; cursor: pointer; text-align: left; font-family: inherit;
      transition: background .15s;
    }
    .sb-nav-item:hover { background: var(--surface); }
    .sb-nav-item svg { color: var(--text-muted); width: 20px; height: 20px; flex-shrink: 0; }
    .sb-divider { margin: 8px 18px 12px; border-top: 1px solid var(--border); }
    
    /* Dynamic History List (Initially empty!) */
    .sb-history-list { flex: 1; overflow-y: auto; padding: 0 14px 14px; display: flex; flex-direction: column; gap: 2px; }
    .empty-history { text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px 10px; }
    .history-link {
      padding: 8px 10px; border-radius: 8px; font-size: 14px; color: var(--text);
      cursor: pointer; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
      transition: background .15s;
    }
    .history-link:hover { background: var(--surface); }

    .sb-footer {
      padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid var(--border);
    }
    .blue-chat-btn {
      display: flex; align-items: center; gap: 8px; padding: 9px 20px; border-radius: 999px;
      background: var(--accent); border: none; color: #fff; font-size: 14.5px; font-weight: 600;
      cursor: pointer; transition: transform .15s, background .15s; box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }
    .blue-chat-btn:hover { background: #1d4ed8; }
    .blue-chat-btn:active { transform: scale(0.95); }
    .theme-toggle-btn {
      width: 36px; height: 36px; border-radius: 50%; background: var(--surface);
      border: none; color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s;
    }
    .theme-toggle-btn:hover { background: var(--surface-h); }

    /* ─── MAIN CHAT VIEW ─── */
    .main { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
    .topbar {
      height: 60px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 20; shrink: 0;
    }
    .btn-circle {
      width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: none;
      color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .15s, background .15s;
    }
    .btn-circle:hover { background: var(--surface-h); }
    .btn-circle:active { transform: scale(0.92); }
    .get-plus-pill {
      display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px;
      background: #1b2533; border: 1px solid rgba(43,76,126,0.4); color: #5ba2f8;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
    }
    body.light .get-plus-pill {
      background: #e5efff; border-color: #bcd6ff; color: #1d6fe5;
    }
    .get-plus-pill:active { transform: scale(0.95); }

    /* ─── CHAT AREA ─── */
    .chat-scroll {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
      padding: 16px 16px 120px;
    }
    .chat-flow { width: 100%; max-width: 680px; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
    .welcome-starters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .starter-btn {
      display: flex; align-items: center; gap: 12px; background: none; border: none;
      color: var(--text); font-size: 15px; font-family: inherit; padding: 8px 4px;
      cursor: pointer; text-align: left; transition: opacity .15s;
    }
    .starter-btn:hover { opacity: 0.8; }
    .starter-btn svg { color: var(--text-muted); width: 20px; height: 20px; }

    /* Messages */
    .msg-group { display: flex; flex-direction: column; gap: 18px; padding-top: 10px; }
    .msg-row { display: flex; flex-direction: column; animation: msgFade .25s ease forwards; }
    @keyframes msgFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .msg-row.user { align-items: flex-end; }
    .msg-row.bot { align-items: flex-start; }
    .user-bubble {
      background: var(--user-bubble); color: var(--user-text); padding: 11px 18px; border-radius: 24px;
      border-bottom-right-radius: 6px; font-size: 15.5px; line-height: 1.55; max-width: 82%;
    }
    .bot-content { font-size: 15.5px; line-height: 1.65; color: var(--text); max-width: 100%; width: 100%; }
    .cursor-blink { display: inline-block; width: 6px; height: 16px; background: currentColor; margin-left: 4px; animation: blink 1s infinite; vertical-align: middle; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* ─── COMPACT INPUT BAR WITH EXPANSION ANIMATION ─── */
    .dock-wrap {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 0 16px 16px;
      display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 30;
    }
    .dock-inner {
      width: 82%; max-width: 500px; pointer-events: auto;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1), max-width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dock-inner:focus-within,
    .dock-inner.expanded {
      width: 96%; max-width: 680px;
    }
    .dock-pill {
      background: var(--pill-bg); border: 1px solid var(--pill-border); border-radius: 999px;
      padding: 6px 8px 6px 12px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4); transition: border-color .2s;
    }
    .dock-pill:focus-within { border-color: #555555; }
    .attach-btn {
      width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: none;
      color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s; shrink: 0;
    }
    .attach-btn:hover { background: var(--surface-h); }
    .attach-btn:active { transform: scale(0.9); }
    #chatInput {
      flex: 1; background: transparent; border: none; outline: none; color: var(--text);
      font-family: inherit; font-size: 15.5px; resize: none; max-height: 140px; padding: 6px 0;
    }
    #chatInput::placeholder { color: var(--text-muted); }
    .mic-btn {
      width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none;
      color: var(--text-muted); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s; shrink: 0;
    }
    .mic-btn:hover { background: var(--surface); color: var(--text); }
    .blue-voice-btn {
      width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: none;
      color: #fff; display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 4px 14px rgba(37,99,235,0.35); transition: transform .15s; shrink: 0;
    }
    .blue-voice-btn:hover { background: #1d4ed8; }
    .blue-voice-btn:active { transform: scale(0.9); }
    .voice-bars { display: flex; align-items: center; gap: 2px; height: 16px; }
    .v-bar { width: 2.5px; background: #fff; border-radius: 2px; animation: bounceBar 1.2s infinite ease-in-out; }
    .v-bar:nth-child(1) { height: 10px; animation-delay: 0s; }
    .v-bar:nth-child(2) { height: 16px; animation-delay: 0.18s; }
    .v-bar:nth-child(3) { height: 8px; animation-delay: 0.36s; }
    @keyframes bounceBar { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1.1); } }
    .send-arrow-btn {
      width: 36px; height: 36px; border-radius: 50%; background: var(--text); border: none;
      color: var(--bg); display: none; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .15s; shrink: 0; font-weight: 700;
    }
    .send-arrow-btn:active { transform: scale(0.9); }

    /* ─── LIVE VOICE MODE OVERLAY ─── */
    .voice-overlay {
      display: none; position: fixed; inset: 0; background: #000000; z-index: 200;
      flex-direction: column; justify-content: space-between; padding: 24px;
    }
    .voice-overlay.active { display: flex; }
    .voice-orb {
      width: 170px; height: 170px; border-radius: 50%; margin: auto;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #2563eb 60%, #7c3aed 100%);
      box-shadow: 0 0 60px rgba(59,130,246,0.6); display: flex; align-items: center;
      justify-content: center; animation: orbPulse 3s infinite ease-in-out;
    }
    @keyframes orbPulse { 0%, 100% { transform: scale(1); filter: blur(0px); } 50% { transform: scale(1.15); filter: blur(1px); } }
  </style>
</head>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Scheduled</span>

      <div class="empty-history">No previous chats yet</div>

    <!-- Bottom: Blue [✏️ Chat] button + Theme switch -->

      <button class="blue-chat-btn" onclick="startNewChat()">

        <button class="btn-circle" onclick="openSidebar()" title="Menu">

          Get Plus
        </button>
      </div>
      <button class="btn-circle" onclick="startNewChat()" title="New Chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
    </header>

    <!-- Message Scroller Area -->
    <div class="chat-scroll" id="chatScroller">
      <div class="chat-flow" id="chatFlow">
        <div class="welcome-starters" id="welcomeStarters">
          <button class="starter-btn" onclick="document.getElementById('hiddenFileInput').click()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Create an image or sticker
          </button>
          <button class="starter-btn" onclick="submitMessage('Write a clean executive summary')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            Write or edit
          </button>
        </div>
        <div class="msg-group" id="messagesList"></div>
      </div>
    </div>

    <!-- Bottom Compact Input Capsule Dock (Shrunk from sides, Expands on click!) -->
    <div class="dock-wrap">
      <div class="dock-inner" id="dockInner">
        <div class="dock-pill">
          <input type="file" id="hiddenFileInput" accept="image/*" style="display:none;" onchange="handleFileSelected(event)"/>
          <button class="attach-btn" onclick="document.getElementById('hiddenFileInput').click()" title="Attachment">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <textarea id="chatInput" rows="1" placeholder="Ask Vektra" onfocus="handleFocus()" onblur="handleBlur()" oninput="autoGrow(this)" onkeydown="handleKeyDown(event)"></textarea>
          <button class="mic-btn" id="micBtn" onclick="alert('Voice dictation active')" title="Voice Dictation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <button class="blue-voice-btn" id="voiceBtn" onclick="openVoiceMode()" title="Live Voice Mode">
            <div class="voice-bars">
              <span class="v-bar"></span><span class="v-bar"></span><span class="v-bar"></span>
            </div>
          </button>
          <button class="send-arrow-btn" id="sendBtn" onclick="submitMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ── LIVE VOICE MODE OVERLAY ── -->
<div class="voice-overlay" id="voiceOverlay">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <span style="font-size:12px;font-family:'JetBrains Mono',monospace;color:#8e8ea0;">Vektra Voice Mode · Live</span>
    <button onclick="closeVoiceMode()" style="width:36px;height:36px;border-radius:50%;background:#212121;border:none;color:#fff;cursor:pointer;">✕</button>
  </div>
  <div class="voice-orb"></div>
  <div style="text-align:center;">
    <p style="color:#a3a3a3;font-size:14.5px;">Listening... Speak freely.</p>
  </div>
</div>

<script>
  const API_ENDPOINT = 'https://vektrastudio-bot.onrender.com';
  const chatInput = document.getElementById('chatInput');
  const dockInner = document.getElementById('dockInner');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  const messagesList = document.getElementById('messagesList');
  const chatScroller = document.getElementById('chatScroller');
  const sbHistoryList = document.getElementById('sbHistoryList');
  let isGenerating = false;
  let dynamicHistory = [];

  function handleFocus() {
    dockInner.classList.add('expanded');
  }

  function handleBlur() {
    if (!chatInput.value.trim()) {
      dockInner.classList.remove('expanded');
    }
  }

  chatInput.addEventListener('input', () => {
    const hasText = chatInput.value.trim().length > 0;
    sendBtn.style.display = hasText ? 'flex' : 'none';
    micBtn.style.display = hasText ? 'none' : 'flex';
    voiceBtn.style.display = hasText ? 'none' : 'flex';
  });

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitMessage();
    }
  }

  function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    localStorage.setItem('vektra_theme', isLight ? 'light' : 'dark');
  }
  if (localStorage.getItem('vektra_theme') === 'light') {
    document.body.classList.add('light');
  }

  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('drawerBackdrop').classList.add('active');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('drawerBackdrop').classList.remove('active');
  }

  function openVoiceMode() { document.getElementById('voiceOverlay').classList.add('active'); }
  function closeVoiceMode() { document.getElementById('voiceOverlay').classList.remove('active'); }

  function startNewChat() {
    messagesList.innerHTML = '';
    document.getElementById('welcomeStarters').style.display = 'flex';
    closeSidebar();
  }

  function addHistoryItem(title) {
    if (dynamicHistory.length === 0) {
      sbHistoryList.innerHTML = '';
    }
    dynamicHistory.unshift(title);
    const item = document.createElement('div');
    item.className = 'history-link';
    item.innerText = title;
    item.onclick = closeSidebar;
    sbHistoryList.prepend(item);
  }

  function renderMD(text) {
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/^### (.*$)/gim, '<h4 style="font-size:15px;margin:8px 0 4px;">$1</h4>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,0.08);padding:2px 5px;border-radius:4px;font-family:monospace;font-size:12px;">$1</code>');
  }

  async function submitMessage(overrideText) {
    const text = overrideText || chatInput.value.trim();
    if (!text || isGenerating) return;

    if (messagesList.children.length === 0) {
      addHistoryItem(text.length > 28 ? text.slice(0, 28) + '...' : text);
    }

    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendBtn.style.display = 'none';
    micBtn.style.display = 'flex';
    voiceBtn.style.display = 'flex';
    document.getElementById('welcomeStarters').style.display = 'none';

    // User Message
    const userRow = document.createElement('div');
    userRow.className = 'msg-row user';
    userRow.innerHTML = `<div class="user-bubble">${text}</div>`;
    messagesList.appendChild(userRow);

    // Bot Response Container
    const botRow = document.createElement('div');
    botRow.className = 'msg-row bot';
    botRow.innerHTML = `<div class="bot-content" id="botContent"><span class="cursor-blink"></span></div>`;
    messagesList.appendChild(botRow);
    chatScroller.scrollTop = chatScroller.scrollHeight;
    isGenerating = true;

    try {
      const res = await fetch(API_ENDPOINT + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      typewrite(data.reply || 'Response complete.', botRow.querySelector('#botContent'));
    } catch (_) {
      typewrite(`I received: **"${text}"**.\n\n- The sidebar now says **Vektra**.\n- Chat history is dynamic and only created as you message.\n- Left edge is pure solid black with zero gray bleeding.`, botRow.querySelector('#botContent'));
    }
  }

  function scrollToBottom(forceInstant = false) {
    requestAnimationFrame(() => {
      chatScroller.scrollTop = chatScroller.scrollHeight;
      if (messagesList.lastElementChild) {
        messagesList.lastElementChild.scrollIntoView({
          behavior: forceInstant ? 'auto' : 'smooth',
          block: 'end'
        });
      }
      chatScroller.scrollTop = chatScroller.scrollHeight;
    });
  }

  function typewrite(fullText, container) {
    let i = 0;
    const interval = setInterval(() => {
      i += 3;
      if (i >= fullText.length) {
        clearInterval(interval);
        container.innerHTML = renderMD(fullText);
        isGenerating = false;
        scrollToBottom(true);
      } else {
        container.innerHTML = renderMD(fullText.slice(0, i)) + '<span class="cursor-blink"></span>';
        chatScroller.scrollTop = chatScroller.scrollHeight;
      }
    }, 20);
  }

  function handleFileSelected(e) {
    const file = e.target.files[0];
    if (file) submitMessage(`[Attached image: ${file.name}] Please inspect.`);
  }
</script>
</body>
</html>
