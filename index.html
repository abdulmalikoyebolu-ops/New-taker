<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vectra AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#0d0d12;
  --sb:#13131c;
  --sb-border:rgba(255,255,255,0.06);
  --surface:rgba(255,255,255,0.04);
  --surface-h:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);
  --text:#eeeef5;
  --text-sub:#5a5a72;
  --text-muted:#70708a;
  --accent:#7c3aed;
  --accent-l:#a78bfa;
  --accent-bg:rgba(124,58,237,0.12);
  --chip-bg:rgba(255,255,255,0.05);
  --chip-border:rgba(255,255,255,0.09);
  --user-bubble:linear-gradient(135deg,#7c3aed,#6366f1);
  --bot-bubble:rgba(255,255,255,0.05);
  --bot-border:rgba(255,255,255,0.07);
  --input-bg:rgba(255,255,255,0.05);
  --input-border:rgba(255,255,255,0.1);
}
body.light{
  --bg:#f7f7fb;
  --sb:#ffffff;
  --sb-border:rgba(0,0,0,0.07);
  --surface:rgba(0,0,0,0.03);
  --surface-h:rgba(0,0,0,0.06);
  --border:rgba(0,0,0,0.08);
  --text:#111118;
  --text-sub:#c0c0d0;
  --text-muted:#888898;
  --accent-l:#7c3aed;
  --accent-bg:rgba(124,58,237,0.07);
  --chip-bg:#ffffff;
  --chip-border:rgba(0,0,0,0.1);
  --bot-bubble:#ffffff;
  --bot-border:rgba(0,0,0,0.08);
  --input-bg:#ffffff;
  --input-border:rgba(0,0,0,0.1);
}

html,body{height:100%;height:100dvh;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;transition:background .3s,color .3s;}
.main{height:100%;height:100dvh;}
.sb{height:100%;height:100dvh;}

/* ─── SIDEBAR ─── */
.sb{
  width:220px;flex-shrink:0;
  background:var(--sb);
  border-right:1px solid var(--sb-border);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:background .3s,border-color .3s;
  z-index:10;
}
@media(max-width:768px){
  .sb{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1),background .3s;z-index:200;}
  .sb.open{transform:translateX(0);}
  .sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:199;}
  .sb-overlay.show{display:block;}
}

/* Brand row */
.sb-brand{
  display:flex;align-items:center;gap:9px;
  padding:18px 16px 14px;
  flex-shrink:0;
}
.sb-logo{width:26px;height:26px;flex-shrink:0;}
.sb-logo img{width:100%;height:100%;object-fit:contain;display:block;}
.sb-name{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.02em;}

/* New Chat button */
.sb-newchat{
  margin:0 10px 6px;
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:10px;
  background:var(--accent-bg);border:1px solid rgba(124,58,237,.25);
  color:var(--accent-l);font-family:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;transition:all .2s;text-align:left;width:calc(100% - 20px);
}
.sb-newchat:hover{background:rgba(124,58,237,.18);}
.sb-newchat svg{width:16px;height:16px;flex-shrink:0;}

/* Nav */
.sb-nav{list-style:none;padding:0 10px;display:flex;flex-direction:column;gap:1px;}
.nav-btn{
  display:flex;align-items:center;gap:11px;
  padding:9px 11px;border-radius:9px;
  color:var(--text-muted);font-size:13.5px;font-weight:500;
  cursor:pointer;transition:all .15s;
  border:none;background:none;width:100%;text-align:left;font-family:inherit;
}
.nav-btn:hover{background:var(--surface-h);color:var(--text);}
.nav-btn.active{background:var(--accent-bg);color:var(--accent-l);}
.nav-btn svg{width:17px;height:17px;flex-shrink:0;stroke-width:1.75;}
.nav-more{
  display:flex;align-items:center;gap:11px;
  padding:9px 11px;border-radius:9px;
  color:var(--text-muted);font-size:13.5px;font-weight:500;
  cursor:pointer;transition:all .15s;
  border:none;background:none;width:100%;text-align:left;font-family:inherit;
}
.nav-more:hover{background:var(--surface-h);color:var(--text);}
.three-dots{display:flex;gap:3px;align-items:center;}
.three-dots span{width:4px;height:4px;border-radius:50%;background:currentColor;display:block;}

/* Divider */
.sb-div{height:1px;background:var(--sb-border);margin:8px 10px;}

/* Recent section */
.sb-recent{flex:1;overflow-y:auto;padding:0 10px;}
.sb-recent::-webkit-scrollbar{width:3px;}
.sb-recent::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px;}
.recent-label{
  font-size:11px;font-weight:600;color:var(--text-sub);
  text-transform:uppercase;letter-spacing:.07em;
  padding:10px 2px 5px;
}
.recent-item{
  display:flex;align-items:center;gap:9px;
  padding:7px 8px;border-radius:8px;
  cursor:pointer;transition:background .15s;
}
.recent-item:hover{background:var(--surface-h);}
.recent-item svg{width:14px;height:14px;flex-shrink:0;color:var(--text-sub);}
.recent-item span{font-size:13px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-empty{font-size:12px;color:var(--text-sub);padding:6px 2px;font-style:italic;}
.view-all-btn{
  display:flex;align-items:center;gap:5px;
  padding:6px 2px;font-size:13px;color:var(--accent-l);
  border:none;background:none;font-family:inherit;font-weight:500;
  cursor:pointer;margin-top:2px;
}
.view-all-btn:hover{opacity:.8;}
.view-all-btn svg{width:13px;height:13px;}

/* Footer */
.sb-footer{
  flex-shrink:0;padding:8px 10px 14px;
  border-top:1px solid var(--sb-border);
}
.user-btn{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:10px;
  cursor:pointer;transition:background .15s;
  border:none;background:none;width:100%;text-align:left;font-family:inherit;
}
.user-btn:hover{background:var(--surface-h);}
.user-av{
  width:32px;height:32px;border-radius:50%;
  background:var(--accent);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:12px;font-weight:700;color:#fff;letter-spacing:0;
}
.user-info{flex:1;min-width:0;text-align:left;}
.user-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-plan{font-size:11px;color:var(--accent-l);font-weight:500;margin-top:1px;}
.user-dots{color:var(--text-muted);}
.user-dots svg{width:15px;height:15px;}

/* ─── MAIN ─── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative;}

/* Topbar — truly floating over content */
.topbar{
  display:flex;align-items:center;justify-content:flex-end;
  padding:14px 16px 10px;gap:10px;
  flex-shrink:0;
  background:transparent;
  border:none;
  position:absolute;top:0;right:0;left:0;
  z-index:20;
  pointer-events:none; /* let clicks through the gap */
}
/* but buttons still clickable */
.topbar > *{pointer-events:all;}
.topbar-left{display:none;margin-right:auto;align-items:center;gap:10px;}
@media(max-width:768px){.topbar-left{display:flex;}}
.topbar-brand{display:none;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--text);}
@media(max-width:768px){.topbar-brand{display:flex;}}
.topbar-brand img{width:22px;height:22px;object-fit:contain;}
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  background:rgba(30,30,42,0.88);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 4px 16px rgba(0,0,0,0.35);
  color:var(--text-muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
body.light .icon-btn{
  background:rgba(255,255,255,0.92);border-color:rgba(0,0,0,0.1);
  box-shadow:0 4px 16px rgba(0,0,0,0.1);
}
.icon-btn:hover{background:rgba(50,50,66,0.95);color:var(--text);transform:scale(1.05);}
body.light .icon-btn:hover{background:rgba(245,245,250,0.98);}
.icon-btn:active{transform:scale(0.95);}
.icon-btn svg{width:16px;height:16px;pointer-events:none;}
.plus-btn{
  display:flex;align-items:center;gap:7px;
  padding:8px 18px;border-radius:999px;
  background:rgba(124,58,237,0.92);
  border:1px solid rgba(124,58,237,0.5);
  box-shadow:0 4px 18px rgba(124,58,237,0.4);
  color:#fff;font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .2s;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.plus-btn:hover{background:rgba(124,58,237,1);box-shadow:0 6px 24px rgba(124,58,237,0.55);transform:scale(1.03);}
.plus-btn:active{transform:scale(0.97);}
.plus-btn svg{width:13px;height:13px;}

/* ─── MESSAGES ─── */
.msgs-outer{
  flex:1;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;
  padding-top:68px; /* space for floating topbar */
  /* fade top edge so messages dissolve under the topbar */
  -webkit-mask-image: linear-gradient(
    to bottom,
    transparent 0px,
    transparent 60px,
    black 110px,
    black calc(100% - 0px)
  );
  mask-image: linear-gradient(
    to bottom,
    transparent 0px,
    transparent 60px,
    black 110px,
    black calc(100% - 0px)
  );
}
.msgs-outer::-webkit-scrollbar{width:4px;}
.msgs-outer::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:4px;}
#msgs{
  width:100%;max-width:700px;
  padding:24px 20px 8px;
  display:flex;flex-direction:column;gap:14px;
  flex:1; /* stretch to fill msgs-outer */
  min-height:100%;
}

/* ── Welcome ── */
.welcome{
  display:flex;flex-direction:column;
  justify-content:flex-end;  /* push to bottom */
  align-items:center;
  flex:1;
  padding:0 0 32px 0;
  width:100%;
}
@keyframes fadein{to{opacity:1;}}
@keyframes cardup{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

/* ── Suggestion cards ── */
.suggestions{
  display:flex;flex-direction:row;
  flex-wrap:nowrap;
  gap:14px;
  padding:0 24px 4px;
  justify-content:center;
  align-items:stretch;
  width:100%;
  max-width:900px;
  margin:0 auto;
  overflow:visible; /* NO clipping on desktop */
  box-sizing:border-box;
}
/* stagger animations */
.sug-item:nth-child(1){animation:cardup .35s ease .05s both;}
.sug-item:nth-child(2){animation:cardup .35s ease .12s both;}
.sug-item:nth-child(3){animation:cardup .35s ease .19s both;}
.sug-item:nth-child(4){animation:cardup .35s ease .26s both;}
.sug-item:nth-child(5){animation:cardup .35s ease .33s both;}
/* stagger fade-up on each card */
.sug-item:nth-child(1){animation:cardup .35s ease .05s both;}
.sug-item:nth-child(2){animation:cardup .35s ease .12s both;}
.sug-item:nth-child(3){animation:cardup .35s ease .19s both;}
.sug-item:nth-child(4){animation:cardup .35s ease .26s both;}
.sug-item:nth-child(5){animation:cardup .35s ease .33s both;}
@keyframes cardup{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

.sug-item{
  display:flex;flex-direction:column;align-items:flex-start;
  justify-content:space-between;
  padding:18px 16px 18px;
  border-radius:20px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.09);
  box-shadow:0 6px 24px rgba(0,0,0,0.35),0 1px 4px rgba(0,0,0,0.2);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  cursor:pointer;
  width:160px;height:160px;flex-shrink:0;
  text-align:left;font-family:inherit;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),
             box-shadow .22s ease,
             border-color .22s ease;
}
body.light .sug-item{
  background:rgba(255,255,255,0.95);
  border-color:rgba(0,0,0,0.07);
  box-shadow:0 4px 18px rgba(0,0,0,0.08),0 1px 4px rgba(0,0,0,0.05);
}
.sug-item:hover{
  transform:translateY(-4px) scale(1.03);
  box-shadow:0 12px 32px rgba(0,0,0,0.45),0 2px 8px rgba(124,58,237,0.15);
  border-color:rgba(124,58,237,0.3);
}
body.light .sug-item:hover{
  box-shadow:0 8px 24px rgba(0,0,0,0.1),0 2px 8px rgba(124,58,237,0.12);
  border-color:rgba(124,58,237,0.25);
}
.sug-item:active{transform:scale(0.96);}

/* icon sits at top */
.sug-icon{
  width:40px;height:40px;border-radius:12px;
  background:rgba(124,58,237,0.14);
  border:none;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-bottom:auto;
}
body.light .sug-icon{background:rgba(124,58,237,0.1);}
.sug-icon svg{width:20px;height:20px;stroke:var(--accent-l);pointer-events:none;}

/* text sits at bottom */
.sug-texts{display:flex;flex-direction:column;gap:4px;width:100%;}
.sug-title{
  font-size:13.5px;font-weight:700;
  color:var(--text);line-height:1.25;
}
body.light .sug-title{color:#111;}
.sug-sub{
  font-size:11.5px;font-weight:400;
  color:var(--text-muted);line-height:1.3;
}
body.light .sug-sub{color:#888;}

/* Bubbles */
.row{display:flex;gap:10px;opacity:0;animation:slideup .25s ease forwards;}
.row.user{justify-content:flex-end;}
.row.bot{justify-content:flex-start;}
@keyframes slideup{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.bavatar{width:28px;height:28px;flex-shrink:0;align-self:flex-end;}
.bavatar img{width:100%;height:100%;object-fit:contain;border-radius:50%;}
.bcol{display:flex;flex-direction:column;gap:3px;max-width:76%;}
.bubble{padding:11px 16px;border-radius:18px;font-size:14px;line-height:1.65;word-break:break-word;}
.row.user .bubble{background:var(--user-bubble);color:#fff;border-bottom-right-radius:4px;}
.row.bot .bubble{background:var(--bot-bubble);color:var(--text);border:1px solid var(--bot-border);border-bottom-left-radius:4px;}
.img-bubble{padding:0!important;background:none!important;border:none!important;overflow:hidden;border-radius:14px;}
.img-bubble img{display:block;max-width:100%;border-radius:14px;max-height:340px;object-fit:cover;}
.img-caption{padding:7px 12px 6px;font-size:13px;color:#fff;background:var(--user-bubble);border-bottom-left-radius:12px;border-bottom-right-radius:12px;}
.voice-bubble{display:flex;align-items:center;gap:10px;padding:10px 14px;min-width:180px;}
.vplay{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.vwave{display:flex;align-items:center;gap:2px;flex:1;height:24px;}
.vbar{width:3px;border-radius:3px;background:rgba(255,255,255,.6);flex-shrink:0;}
.btime{font-size:10px;color:var(--text-sub);padding:0 3px;}
.row.user .btime{text-align:right;}

/* Feedback */
.feedback{display:flex;align-items:center;gap:4px;margin-top:5px;padding:0 2px;}
.fbtn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text-sub);cursor:pointer;padding:4px 8px;font-size:12px;display:flex;align-items:center;gap:4px;transition:all .18s;font-family:inherit;}
.fbtn:hover{border-color:rgba(124,58,237,.4);color:var(--accent-l);background:var(--accent-bg);}
.fbtn.liked{border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,.08);}
.fbtn.disliked{border-color:#ef4444;color:#ef4444;background:rgba(239,68,68,.08);}
.fbtn.copied{border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,.08);}
.fbtn svg{width:12px;height:12px;pointer-events:none;}

/* Typing */
.typing{background:var(--bot-bubble);border:1px solid var(--bot-border);border-radius:18px;border-bottom-left-radius:4px;padding:12px 16px;display:flex;gap:5px;align-items:center;}
.td{width:6px;height:6px;border-radius:50%;background:var(--text-sub);animation:tbounce 1.2s infinite;}
.td:nth-child(2){animation-delay:.2s;}.td:nth-child(3){animation-delay:.4s;}
@keyframes tbounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-6px);background:var(--accent-l);}}

/* footer handled below */

/* Recording */
#recrow{display:none;align-items:center;gap:10px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.22);border-radius:14px;padding:8px 12px;margin-bottom:8px;}
#recrow.show{display:flex;}
.rec-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;flex-shrink:0;animation:rpulse 1s infinite;}
@keyframes rpulse{0%,100%{opacity:1;}50%{opacity:.2;}}
.rec-time{font-size:14px;font-weight:600;color:#ef4444;font-variant-numeric:tabular-nums;flex-shrink:0;min-width:38px;}
.rec-wave{display:flex;align-items:center;gap:2px;flex:1;height:26px;overflow:hidden;}
.rwb{width:3px;border-radius:3px;background:#ef4444;animation:rwav .6s ease-in-out infinite alternate;flex-shrink:0;opacity:.55;}
@keyframes rwav{from{height:3px;}to{height:var(--h,16px);}}
.rwb:nth-child(2n){animation-delay:.15s;}.rwb:nth-child(3n){animation-delay:.3s;}
.rec-del{width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0;}
.rec-del:hover{color:#ef4444;}
.rec-del svg{width:14px;height:14px;pointer-events:none;}
.rec-send{width:32px;height:32px;border-radius:50%;background:var(--accent);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.rec-send svg{width:14px;height:14px;pointer-events:none;}

/* ── Floating input bar ── */
.footer-wrap{
  flex-shrink:0;
  padding:8px 16px 20px;
  display:flex;flex-direction:column;align-items:center;
  background:transparent; /* NO background bar — floating look */
  position:relative;
  z-index:10;
}
.footer-inner{width:100%;max-width:660px;}
.footer-hint{text-align:center;font-size:11px;color:var(--text-sub);padding-top:8px;opacity:.7;}

/* Floating pill */
.input-wrap{
  background:rgba(28,28,40,0.93);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:999px;
  padding:8px 8px 8px 20px;
  display:flex;align-items:center;gap:2px;
  box-shadow:0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
  /* expand animation on focus */
  transition:min-height .3s cubic-bezier(.34,1.56,.64,1),
             padding .3s cubic-bezier(.34,1.56,.64,1),
             box-shadow .3s ease,
             border-color .25s ease;
  min-height:56px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  transform-origin:center bottom;
}
body.light .input-wrap{
  background:rgba(255,255,255,0.96);
  border-color:rgba(0,0,0,0.1);
  box-shadow:0 8px 32px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.06);
}
.input-wrap:focus-within{
  border-color:rgba(124,58,237,.6);
  box-shadow:0 16px 48px rgba(124,58,237,0.28), 0 4px 16px rgba(0,0,0,0.4);
  min-height:64px;
  padding-top:12px;
  padding-bottom:12px;
}

#msginput{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-family:inherit;font-size:15px;
  resize:none;max-height:140px;line-height:1.55;
  padding:0 4px;min-height:22px;
}
#msginput::placeholder{color:rgba(255,255,255,0.28);}
body.light #msginput::placeholder{color:rgba(0,0,0,0.3);}

/* icon buttons */
.iact{
  width:40px;height:40px;border-radius:50%;
  background:none;border:none;
  color:rgba(255,255,255,0.5);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .18s;flex-shrink:0;
}
body.light .iact{color:rgba(0,0,0,0.4);}
.iact:hover{color:rgba(255,255,255,0.9);background:rgba(255,255,255,0.07);}
body.light .iact:hover{color:rgba(0,0,0,0.8);background:rgba(0,0,0,0.06);}
.iact:active{transform:scale(0.9);}
.iact svg{width:20px;height:20px;pointer-events:none;}

/* + circle button */
.iact-plus{
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,0.13);
  color:rgba(255,255,255,0.9);
  flex-shrink:0;
}
body.light .iact-plus{background:rgba(0,0,0,0.09);color:#111;}
.iact-plus:hover{background:rgba(255,255,255,0.22)!important;}
body.light .iact-plus:hover{background:rgba(0,0,0,0.15)!important;}
.iact-plus svg{width:17px;height:17px;}

/* Send button — purple circle, expands on click */
#sendbtn{
  width:40px;height:40px;border-radius:50%;
  background:var(--accent);border:none;cursor:pointer;
  color:#fff;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 4px 14px rgba(124,58,237,0.5);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s, opacity .15s;
}
#sendbtn:hover{
  transform:scale(1.1);
  box-shadow:0 6px 20px rgba(124,58,237,0.65);
}
#sendbtn:active{
  transform:scale(1.22);
  box-shadow:0 8px 28px rgba(124,58,237,0.8);
}
#sendbtn:disabled{
  opacity:.28;cursor:not-allowed;
  transform:none;box-shadow:none;
}
#sendbtn svg{width:17px;height:17px;pointer-events:none;}
@keyframes sendbounce{
  0%{transform:scale(1);}
  40%{transform:scale(1.28);}
  70%{transform:scale(0.92);}
  100%{transform:scale(1);}
}
#sendbtn.sending{animation:sendbounce .4s cubic-bezier(.34,1.56,.64,1);}

/* ── MOBILE RESPONSIVE ── */
@media(max-width:600px){
  /* Full-width layout */
  html,body{height:100%;height:100dvh;}
  .main{width:100%;min-width:0;}

  /* Topbar tighter */
  .topbar{padding:8px 12px;gap:8px;}
  .plus-btn{padding:6px 12px;font-size:12px;}
  .plus-btn span{display:none;}

  /* Messages full width */
  #msgs{padding:16px 12px 6px;gap:10px;}
  .bcol{max-width:88%;}

  /* Mobile: cards at bottom, horizontal scroll */
  .welcome{padding:0 0 14px;justify-content:flex-end;}
  .suggestions{
    overflow-x:auto;overflow-y:hidden;
    flex-wrap:nowrap;
    justify-content:flex-start;
    padding:0 14px 4px;
    gap:10px;
    max-width:100%;width:100%;
    scrollbar-width:none;
  }
  .suggestions::-webkit-scrollbar{display:none;}
  .sug-item{width:128px;height:128px;padding:14px 13px;border-radius:18px;flex-shrink:0;}
  .sug-icon{width:34px;height:34px;border-radius:10px;}
  .sug-icon svg{width:16px;height:16px;}
  .sug-title{font-size:12px;}
  .sug-sub{font-size:11px;}
  .msgs-outer{padding-top:60px;}

  /* Floating input */
  .footer-wrap{padding:6px 12px 18px;}
  .footer-hint{font-size:10.5px;padding-top:6px;}
  .input-wrap{padding:7px 7px 7px 18px;min-height:52px;}
  #msginput{font-size:15px;}
  .iact{width:38px;height:38px;}
  .iact svg{width:19px;height:19px;}
  .iact-plus{width:36px;height:36px;}
  #sendbtn{width:38px;height:38px;}
  #sendbtn svg{width:16px;height:16px;}

  /* Bubbles */
  .bubble{font-size:13.5px;padding:10px 14px;}
  .btime{font-size:9.5px;}
  .bavatar{width:24px;height:24px;}

  /* Feedback buttons */
  .fbtn{padding:3px 6px;font-size:11px;}

  /* Recording row */
  #recrow{padding:6px 10px;gap:8px;}
  .rec-time{font-size:13px;}

  /* Modals */
  .prev-box,.fb-box{border-radius:16px;padding:14px;}
}

/* Modals */
#imgpreview{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:20px;}
#imgpreview.show{display:flex;}
.prev-box{background:var(--sb);border:1px solid var(--border);border-radius:20px;padding:16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;}
.prev-img{width:100%;border-radius:12px;max-height:300px;object-fit:contain;display:block;}
.prev-caption{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:14px;outline:none;resize:none;width:100%;}
.prev-caption::placeholder{color:var(--text-muted);}
.prev-actions{display:flex;gap:8px;}
.prev-cancel{flex:1;padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-family:inherit;font-size:13px;cursor:pointer;}
.prev-send{flex:2;padding:10px;border-radius:12px;background:var(--accent);border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
#fbmodal{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px;}
#fbmodal.show{display:flex;}
.fb-box{background:var(--sb);border:1px solid var(--border);border-radius:20px;padding:20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;}
.fb-hd{display:flex;align-items:center;gap:10px;}
.fb-emoji{font-size:22px;}
.fb-title{font-size:15px;font-weight:600;color:var(--text);}
.fb-sub{font-size:12px;color:var(--text-muted);margin-top:1px;}
.fb-ta{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-family:inherit;font-size:14px;outline:none;resize:none;width:100%;line-height:1.5;transition:border-color .2s;}
.fb-ta:focus{border-color:rgba(124,58,237,.4);}
.fb-ta::placeholder{color:var(--text-muted);}
.fb-acts{display:flex;gap:8px;}
.fb-cancel{flex:1;padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-family:inherit;font-size:13px;cursor:pointer;}
.fb-submit{flex:2;padding:10px;border-radius:12px;background:var(--accent);border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.fb-submit:disabled{opacity:.5;cursor:not-allowed;}
#imginput{display:none;}
</style>

        <!-- + button left -->
        <button class="iact iact-plus" onclick="document.getElementById('imginput').click()" title="Attach">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <textarea id="msginput" rows="1" placeholder="Ask Vectra AI..." oninput="resizeInp(this)" onkeydown="onKey(event)"></textarea>
        <!-- mic right -->
        <button class="iact" id="micbtn" onclick="startRec()" title="Voice message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <!-- send = colored circle -->
        <button id="sendbtn" onclick="sendMsg()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
    </div>
    <div class="footer-hint">Vectra AI can make mistakes. Check important info.</div>
  </div>

</div>

<!-- Feedback modal -->
<div id="fbmodal">
  <div class="fb-box">
    <div class="fb-hd">
      <div class="fb-emoji" id="fb-emoji">👍</div>
      <div>
        <div class="fb-title" id="fb-title">What did you like?</div>
        <div class="fb-sub">Your feedback goes directly to the developer</div>
      </div>
    </div>
    <textarea class="fb-ta" id="fb-text" rows="4" placeholder="Tell us what you think... (optional)"></textarea>
    <div class="fb-acts">
      <button class="fb-cancel" onclick="closeFbModal()">Cancel</button>
      <button class="fb-submit" id="fb-submit-btn" onclick="submitFeedback()">Send Feedback</button>
    </div>
  </div>
</div>

<!-- Image preview -->
<div id="imgpreview">
  <div class="prev-box">
    <img class="prev-img" id="previmg" src="" alt="preview"/>
    <textarea class="prev-caption" id="prevcaption" placeholder="Add a caption..." rows="2"></textarea>
    <div class="prev-actions">
      <button class="prev-cancel" onclick="cancelPreview()">Cancel</button>
      <button class="prev-send" onclick="confirmSendImage()">Send</button>
    </div>
  </div>
</div>

<script>
var API = 'https://vektrastudio-bot.onrender.com';
var SID = 'web_' + Math.random().toString(36).slice(2, 9);
var busy = false;
var isLight = localStorage.getItem('vtheme') === 'light';
var recorder = null, recChunks = [], recInterval = null, recSecs = 0, recStream = null;
var recentChats = [];

var inp = document.getElementById('msginput');
var sbtn = document.getElementById('sendbtn');
var msgs = document.getElementById('msgs');

if (isLight) document.body.classList.add('light');

// Init logos and greeting on load
window.addEventListener('load', function() {
  var logo = document.getElementById('logoimg').src;
  var tl = document.getElementById('topbarLogo');
  if (tl) tl.src = logo;
  var h = new Date().getHours();
  var g = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  var wg = document.getElementById('welcomeGreeting');
  if (wg) wg.textContent = g + '!';
  updateThemeBtn();
});

// Theme
function toggleTheme() {
  isLight = !isLight;
  localStorage.setItem('vtheme', isLight ? 'light' : 'dark');
  document.body.classList.toggle('light', isLight);
  updateThemeBtn();
}
function updateThemeBtn() {
  var btn = document.getElementById('themebtn');
  if (!btn) return;
  if (isLight) {
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  } else {
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  }
}

// Sidebar
function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sbOverlay').classList.add('show'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sbOverlay').classList.remove('show'); }

// Recent chats
function addRecentChat(title) {
  // Remove if already exists
  recentChats = recentChats.filter(function(t) { return t !== title; });
  recentChats.unshift(title);
  if (recentChats.length > 6) recentChats = recentChats.slice(0, 6);
  renderRecent();
}
function renderRecent() {
  var list = document.getElementById('recentList');
  var vab = document.getElementById('viewAllBtn');
  if (!recentChats.length) {
    list.innerHTML = '<div class="recent-empty">No recent chats yet.</div>';
    if (vab) vab.style.display = 'none';
    return;
  }
  var icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
  list.innerHTML = recentChats.slice(0, 5).map(function(t) {
    return '<div class="recent-item" onclick="closeSidebar()">' + icon + '<span>' + t + '</span></div>';
  }).join('');
  if (vab) vab.style.display = recentChats.length > 5 ? 'flex' : 'none';
}

inp.addEventListener('input', function() { sbtn.disabled = !inp.value.trim() || busy; });
function resizeInp(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }
function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!sbtn.disabled) sendMsg(); } }
function getTime() { return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function getLogo() { return document.getElementById('logoimg').src; }
function hideWelcome() { var w = document.getElementById('welcome'); if (w) w.style.display = 'none'; var s = document.getElementById('sugCards'); if(s) { s.style.transition='opacity .3s ease'; s.style.opacity='0'; setTimeout(function(){s.style.display='none';},300); } }

function sendChip(el) {
  var txt = typeof el === 'string' ? el : el.textContent;
  sendMsg(txt);
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(function() {
    btn.classList.add('copied'); btn.querySelector('span').textContent = 'Copied!';
    setTimeout(function() { btn.classList.remove('copied'); btn.querySelector('span').textContent = 'Copy'; }, 2000);
  }).catch(function() { btn.querySelector('span').textContent = 'Failed'; });
}

// Feedback
var fbType = '', fbMsgText = '', fbLikeBtn = null, fbDislikeBtn = null;
function openFbModal(type, msgText, lb, db) {
  fbType = type; fbMsgText = msgText; fbLikeBtn = lb; fbDislikeBtn = db;
  var isLike = type === 'thumbs_up';
  document.getElementById('fb-emoji').textContent = isLike ? '👍' : '👎';
  document.getElementById('fb-title').textContent = isLike ? 'What did you like?' : 'What can be improved?';
  document.getElementById('fb-text').value = '';
  document.getElementById('fb-submit-btn').disabled = false;
  document.getElementById('fb-submit-btn').textContent = 'Send Feedback';
  document.getElementById('fbmodal').classList.add('show');
  setTimeout(function() { document.getElementById('fb-text').focus(); }, 100);
}
function closeFbModal() { document.getElementById('fbmodal').classList.remove('show'); }

var EMAILJS_READY = false;
window.addEventListener('load', function() {
  if (typeof emailjs !== 'undefined') { emailjs.init({publicKey:'YOUR_EMAILJS_PUBLIC_KEY'}); EMAILJS_READY = true; }
});
async function submitFeedback() {
  var comment = document.getElementById('fb-text').value.trim();
  var sb2 = document.getElementById('fb-submit-btn');
  sb2.disabled = true; sb2.textContent = 'Sending...';
  var emoji = fbType === 'thumbs_up' ? '👍' : '👎';
  try {
    if (EMAILJS_READY) {
      await emailjs.send('YOUR_SERVICE_ID','YOUR_TEMPLATE_ID',{feedback_type:emoji+' '+fbType.replace('_',' ').toUpperCase(),user_comment:comment||'(no comment)',bot_message:fbMsgText,session_id:SID,sent_time:new Date().toLocaleString()});
    } else {
      await fetch(API+'/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:fbType,message:fbMsgText,comment:comment,sessionId:SID,time:new Date().toISOString()})});
    }
  } catch(e) { console.log('Feedback error:', e); }
  if (fbType==='thumbs_up'&&fbLikeBtn){fbLikeBtn.classList.add('liked');if(fbDislikeBtn)fbDislikeBtn.classList.remove('disliked');}
  else if(fbDislikeBtn){fbDislikeBtn.classList.add('disliked');if(fbLikeBtn)fbLikeBtn.classList.remove('liked');}
  sb2.textContent = 'Sent! ✓';
  setTimeout(function(){closeFbModal();}, 700);
}

function addFeedback(col, msgText) {
  var fb = document.createElement('div'); fb.className = 'feedback';
  var cb = document.createElement('button'); cb.className = 'fbtn';
  cb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy</span>';
  cb.onclick = function() { copyText(cb, msgText); };
  var lb = document.createElement('button'); lb.className = 'fbtn';
  lb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg><span></span>';
  lb.onclick = function() { if (!lb.classList.contains('liked')) openFbModal('thumbs_up', msgText, lb, db); };
  var db = document.createElement('button'); db.className = 'fbtn';
  db.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg><span></span>';
  db.onclick = function() { if (!db.classList.contains('disliked')) openFbModal('thumbs_down', msgText, lb, db); };
  fb.appendChild(cb); fb.appendChild(lb); fb.appendChild(db);
  col.appendChild(fb);
}

function addMsg(text, role, htmlStr, domEl, extraClass) {
  hideWelcome();
  var row = document.createElement('div'); row.className = 'row ' + role;
  if (role === 'bot') {
    var av = document.createElement('div'); av.className = 'bavatar';
    av.innerHTML = '<img src="' + getLogo() + '" alt="V"/>'; row.appendChild(av);
  }
  var col = document.createElement('div'); col.className = 'bcol';
  var bub = document.createElement('div'); bub.className = 'bubble' + (extraClass ? ' ' + extraClass : '');
  if (domEl) bub.appendChild(domEl);
  else if (htmlStr) bub.innerHTML = htmlStr;
  else bub.textContent = text;
  var t = document.createElement('div'); t.className = 'btime'; t.textContent = getTime();
  col.appendChild(bub); col.appendChild(t);
  if (role === 'bot' && text) addFeedback(col, text);
  row.appendChild(col);
  msgs.appendChild(row);
  document.getElementById('msgsOuter').scrollTop = 99999;
}

function showTyping() {
  hideWelcome();
  var row = document.createElement('div'); row.className = 'row bot'; row.id = 'typing';
  var av = document.createElement('div'); av.className = 'bavatar';
  av.innerHTML = '<img src="' + getLogo() + '" alt="V"/>'; row.appendChild(av);
  var b = document.createElement('div'); b.className = 'typing';
  b.innerHTML = '<div class="td"></div><div class="td"></div><div class="td"></div>';
  row.appendChild(b); msgs.appendChild(row);
  document.getElementById('msgsOuter').scrollTop = 99999;
}
function hideTyping() { var t = document.getElementById('typing'); if (t) t.remove(); }

async function sendMsg(text) {
  var msg = text || inp.value.trim();
  if (!msg || busy) return;
  // bounce animation on send
  sbtn.classList.add('sending');
  setTimeout(function(){sbtn.classList.remove('sending');},420);
  inp.value = ''; inp.style.height = 'auto'; sbtn.disabled = true; busy = true;
  addMsg(msg, 'user');
  addRecentChat(msg.length > 40 ? msg.slice(0, 40) + '…' : msg);
  showTyping();
  try {
    var res = await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,sessionId:SID})});
    var data = await res.json();
    hideTyping(); addMsg(data.reply || data.error || 'Something went wrong!', 'bot');
  } catch(e) { hideTyping(); addMsg('Server is waking up, wait 30 seconds and try again!', 'bot'); }
  busy = false; sbtn.disabled = !inp.value.trim(); inp.focus();
}

// Image upload
var pendingFile = null;
function handleImgSelect(e) {
  var file = e.target.files[0]; if (!file) return; e.target.value = '';
  pendingFile = file;
  var url = URL.createObjectURL(file);
  document.getElementById('previmg').src = url;
  document.getElementById('prevcaption').value = '';
  document.getElementById('imgpreview').classList.add('show');
}
function cancelPreview() { document.getElementById('imgpreview').classList.remove('show'); pendingFile = null; }
async function confirmSendImage() {
  if (!pendingFile) return;
  var file = pendingFile, caption = document.getElementById('prevcaption').value.trim();
  var previewUrl = document.getElementById('previmg').src;
  document.getElementById('imgpreview').classList.remove('show'); pendingFile = null;
  var wrap = document.createElement('div');
  var imgEl = document.createElement('img'); imgEl.src = previewUrl; imgEl.alt = 'image';
  wrap.appendChild(imgEl);
  if (caption) { var capEl = document.createElement('div'); capEl.className = 'img-caption'; capEl.textContent = caption; wrap.appendChild(capEl); }
  addMsg('', 'user', '', wrap, 'img-bubble');
  showTyping(); busy = true; sbtn.disabled = true;
  var reader = new FileReader();
  reader.onload = async function(ev) {
    var b64 = ev.target.result.split(',')[1];
    try {
      var res = await fetch(API+'/vision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64,mimeType:file.type,caption:caption,sessionId:SID})});
      var data = await res.json();
      hideTyping(); addMsg(data.reply || 'Could not analyze image.', 'bot');
    } catch(e) { hideTyping(); addMsg('Could not reach server. Try again!', 'bot'); }
    busy = false; sbtn.disabled = !inp.value.trim();
  };
  reader.readAsDataURL(file);
}

// Voice
function buildWave() {
  var wave = document.getElementById('recwave'); wave.innerHTML = '';
  var h = [6,10,16,22,28,22,16,10,6,12,20,26,20,12,6,14,24,30,24,14,6,10,18,24,18,10,6,8,14,20];
  for (var i=0;i<30;i++){var d=document.createElement('div');d.className='rwb';d.style.setProperty('--h',h[i]+'px');wave.appendChild(d);}
}
async function startRec() {
  try {
    recStream = await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks = []; recorder = new MediaRecorder(recStream);
    recorder.ondataavailable = function(e){if(e.data.size>0)recChunks.push(e.data);};
    recorder.start(100); recSecs = 0;
    document.getElementById('rectime').textContent = '0:00';
    document.getElementById('recrow').classList.add('show');
    document.querySelector('.irow').style.display = 'none';
    buildWave();
    recInterval = setInterval(function(){
      recSecs++;var m=Math.floor(recSecs/60),s=recSecs%60;
      document.getElementById('rectime').textContent=m+':'+(s<10?'0':'')+s;
    },1000);
  } catch(e) { addMsg('Microphone access denied. Please allow microphone access.', 'bot'); }
}
function cancelRec() {
  if (recorder&&recorder.state!=='inactive') recorder.stop();
  if (recStream) recStream.getTracks().forEach(function(t){t.stop();});
  clearInterval(recInterval);
  document.getElementById('recrow').classList.remove('show');
  document.querySelector('.irow').style.display = 'flex';
  recChunks=[]; recorder=null; recStream=null;
}
function stopAndSendRec() {
  clearInterval(recInterval);
  document.getElementById('recrow').classList.remove('show');
  document.querySelector('.irow').style.display = 'flex';
  if (recStream) recStream.getTracks().forEach(function(t){t.stop();});
  if (recorder&&recorder.state!=='inactive'){recorder.onstop=function(){processVoice();};recorder.stop();}
  else processVoice();
}
async function processVoice() {
  if (!recChunks.length) return;
  var blob = new Blob(recChunks,{type:'audio/webm'}); recChunks=[]; recorder=null; recStream=null;
  var audioUrl = URL.createObjectURL(blob);
  var vw = document.createElement('div'); vw.className = 'voice-bubble';
  var ae = document.createElement('audio'); ae.src = audioUrl; ae.preload = 'auto';
  var pb = document.createElement('button'); pb.className = 'vplay'; pb.textContent = '▶';
  pb.onclick = function(){if(ae.paused){ae.play();pb.textContent='⏸';}else{ae.pause();pb.textContent='▶';}};
  ae.onended = function(){pb.textContent='▶';};
  var wd = document.createElement('div'); wd.className = 'vwave';
  var wh=[6,10,18,28,36,28,18,10,6,14,24,34,24,14,6,20,32,40,32,20,6,12,22,30,22,12,6,8,16,24];
  for(var i=0;i<30;i++){var bar=document.createElement('div');bar.className='vbar';bar.style.height=wh[i]+'px';wd.appendChild(bar);}
  vw.appendChild(pb); vw.appendChild(wd); vw.appendChild(ae);
  addMsg('','user','',vw);
  showTyping(); busy=true; sbtn.disabled=true;
  var reader = new FileReader();
  reader.onload = async function(ev){
    var b64=ev.target.result.split(',')[1];
    try{
      var res=await fetch(API+'/voice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio:b64,mimeType:'audio/webm',sessionId:SID})});
      var data=await res.json();
      hideTyping(); addMsg(data.reply||'Could not process voice.','bot');
    }catch(e){hideTyping();addMsg('Could not reach server. Try again!','bot');}
    busy=false; sbtn.disabled=!inp.value.trim();
  };
  reader.readAsDataURL(blob);
}

function clearChat() {
  fetch(API+'/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:SID})}).catch(function(){});
  msgs.innerHTML = '';
  // Reveal footer suggestions with fade-in
  var s = document.getElementById('sugCards');
  if(s){ s.style.display='flex'; s.style.opacity='0'; s.style.transition='none';
    setTimeout(function(){ s.style.transition='opacity .4s ease'; s.style.opacity='1'; },50); }
}
</script>
</body>
