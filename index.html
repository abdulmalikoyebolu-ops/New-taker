<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Vektra AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; height: 100dvh; background: #000000; color: #ececec;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .app { display: flex; width: 100vw; height: 100vh; height: 100dvh; position: relative; }

    /* ─── SIDEBAR DRAWER ─── */
    .drawer-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px); z-index: 90; transition: opacity .3s;
    }
    .drawer-backdrop.active { display: block; }
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; width: 280px; max-width: 85vw;
      background: #171717; border-right: 1px solid #262626; z-index: 100;
      display: flex; flex-direction: column; transform: translateX(-100%);
      transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }
    .sidebar.open { transform: translateX(0); }
    .sb-top { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid #262626; }
    .sb-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
    .sb-logo { width: 30px; height: 30px; border-radius: 8px; background: #212121; border: 1px solid #333; padding: 4px; display: flex; align-items: center; justify-content: center; }
    .sb-logo img { width: 100%; height: 100%; object-fit: contain; }
    .sb-actions { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .new-chat-btn {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-radius: 12px; background: #212121; border: 1px solid #2e2e2e;
      color: #fff; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: background .2s;
    }
    .new-chat-btn:hover { background: #2a2a2a; }
    .search-box {
      width: 100%; padding: 8px 12px; border-radius: 10px; background: #212121;
      border: 1px solid transparent; color: #fff; font-size: 12.5px; outline: none;
    }
    .search-box:focus { border-color: #383838; }
    .history-list { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
    .history-group-title { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: #737373; text-transform: uppercase; padding: 8px 6px 4px; }
    .history-item {
      padding: 8px 10px; border-radius: 10px; font-size: 13px; color: #d4d4d4;
      cursor: pointer; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
      display: flex; align-items: center; gap: 8px; transition: background .15s;
    }
    .history-item:hover { background: #212121; color: #fff; }
    .sb-bottom { padding: 12px 14px; border-top: 1px solid #262626; margin-top: auto; }
    .user-card { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 10px; cursor: pointer; }
    .user-card:hover { background: #212121; }
    .user-av { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#7c3aed,#4f46e5); color:#fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

    /* ─── MAIN CHAT VIEW ─── */
    .main { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
    .topbar {
      height: 60px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 20; shrink: 0;
    }
    .btn-circle {
      width: 40px; height: 40px; border-radius: 50%; background: #212121; border: none;
      color: #d4d4d4; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .15s, background .15s;
    }
    .btn-circle:hover { background: #2a2a2a; color: #fff; }
    .btn-circle:active { transform: scale(0.92); }
    .get-plus-pill {
      display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px;
      background: #1b2533; border: 1px solid rgba(43,76,126,0.4); color: #5ba2f8;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
    }
    .get-plus-pill:hover { background: #213042; }
    .get-plus-pill:active { transform: scale(0.95); }

    /* ─── CHAT AREA ─── */
    .chat-scroll {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
      padding: 16px 16px 120px;
    }
    .chat-flow { width: 100%; max-width: 680px; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
    .welcome-starters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .starter-btn {
      display: flex; align-items: center; gap: 12px; background: none; border: none;
      color: #e5e5e5; font-size: 15px; font-family: inherit; padding: 8px 4px;
      cursor: pointer; text-align: left; transition: color .15s;
    }
    .starter-btn:hover { color: #ffffff; }
    .starter-btn svg { color: #8e8ea0; transition: color .15s; }
    .starter-btn:hover svg { color: #ffffff; }

    /* Messages */
    .msg-group { display: flex; flex-direction: column; gap: 18px; padding-top: 10px; }
    .msg-row { display: flex; flex-direction: column; animation: msgFade .25s ease forwards; }
    @keyframes msgFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .msg-row.user { align-items: flex-end; }
    .msg-row.bot { align-items: flex-start; }
    .user-bubble {
      background: #212121; color: #fff; padding: 12px 18px; border-radius: 24px;
      border-bottom-right-radius: 6px; font-size: 15.5px; line-height: 1.55; max-width: 82%;
    }
    .bot-content { font-size: 15.5px; line-height: 1.65; color: #ececec; max-width: 100%; width: 100%; }
    .bot-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .bot-logo-sq { width: 24px; height: 24px; border-radius: 6px; background: #212121; border: 1px solid #333; padding: 3px; display: flex; align-items: center; justify-content: center; }
    .bot-logo-sq img { width: 100%; height: 100%; object-fit: contain; }
    .cursor-blink { display: inline-block; width: 6px; height: 16px; background: #fff; margin-left: 4px; animation: blink 1s infinite; vertical-align: middle; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Code Block */
    .code-card { margin: 12px 0; border-radius: 12px; overflow: hidden; border: 1px solid #333; background: #0d0d0d; }
    .code-top { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; background: #1a1a1a; color: #8e8ea0; }
    .code-body { padding: 12px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #f4f4f5; line-height: 1.6; }

    /* ─── BOTTOM CHATGPT INPUT DOCK ─── */
    .dock-wrap {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 0 16px 16px;
      display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 30;
    }
    .dock-inner { width: 100%; max-width: 680px; pointer-events: auto; }
    .dock-pill {
      background: #212121; border: 1px solid #2e2e2e; border-radius: 999px;
      padding: 6px 8px 6px 12px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6); transition: border-color .2s;
    }
    .dock-pill:focus-within { border-color: #454545; }
    .attach-btn {
      width: 36px; height: 36px; border-radius: 50%; background: #2f2f2f; border: none;
      color: #d4d4d4; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s; shrink: 0;
    }
    .attach-btn:hover { background: #3a3a3a; color: #fff; }
    .attach-btn:active { transform: scale(0.9); }
    #chatInput {
      flex: 1; background: transparent; border: none; outline: none; color: #fff;
      font-family: inherit; font-size: 15.5px; resize: none; max-height: 140px; padding: 6px 0;
    }
    #chatInput::placeholder { color: #8e8ea0; }
    .mic-btn {
      width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none;
      color: #d4d4d4; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s; shrink: 0;
    }
    .mic-btn:hover { background: #2f2f2f; color: #fff; }
    .blue-voice-btn {
      width: 36px; height: 36px; border-radius: 50%; background: #2b82f6; border: none;
      color: #fff; display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 4px 14px rgba(43,130,246,0.35); transition: transform .15s; shrink: 0;
    }
    .blue-voice-btn:hover { background: #2575e0; }
    .blue-voice-btn:active { transform: scale(0.9); }
    .voice-bars { display: flex; align-items: center; gap: 2px; height: 16px; }
    .v-bar { width: 2.5px; background: #fff; border-radius: 2px; animation: bounceBar 1.2s infinite ease-in-out; }
    .v-bar:nth-child(1) { height: 10px; animation-delay: 0s; }
    .v-bar:nth-child(2) { height: 16px; animation-delay: 0.18s; }
    .v-bar:nth-child(3) { height: 8px; animation-delay: 0.36s; }
    @keyframes bounceBar { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1.1); } }
    .send-arrow-btn {
      width: 36px; height: 36px; border-radius: 50%; background: #ffffff; border: none;
      color: #000; display: none; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .15s; shrink: 0; font-weight: 700;
    }
    .send-arrow-btn:active { transform: scale(0.9); }

    /* ─── FULLSCREEN LIVE VOICE MODE OVERLAY ─── */
    .voice-overlay {
      display: none; position: fixed; inset: 0; background: #000000; z-index: 200;
      flex-direction: column; justify-content: space-between; padding: 24px;
    }
    .voice-overlay.active { display: flex; }
    .voice-orb {
      width: 170px; height: 170px; border-radius: 50%; margin: auto;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #2563eb 60%, #7c3aed 100%);
      box-shadow: 0 0 60px rgba(59,130,246,0.6); display: flex; align-items: center;
      justify-content: center; animation: orbPulse 3s infinite ease-in-out;
    }
    @keyframes orbPulse { 0%, 100% { transform: scale(1); filter: blur(0px); } 50% { transform: scale(1.15); filter: blur(1px); } }
  </style>
</head>
<body>

<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeSidebar()"></div>

<div class="app">

        </div>
        <span>Vektra AI</span>
      </div>
      <button onclick="closeSidebar()" style="background:none;border:none;color:#8e8ea0;cursor:pointer;font-size:16px;">✕</button>
    </div>

    <div class="sb-actions">
      <button class="new-chat-btn" onclick="startNewChat()">
        <span>+ New chat</span>
        <span style="color:#737373;">⌘K</span>
      </button>
      <input type="text" class="search-box" placeholder="Search conversations..."/>
    </div>

    <div class="history-list">
      <div class="history-group-title">Today</div>
      <div class="history-item" onclick="closeSidebar()">Web UI Prototype Analysis</div>
      <div class="history-item" onclick="closeSidebar()">TypeScript Systems Architecture</div>
      <div class="history-group-title">Yesterday</div>
      <div class="history-item" onclick="closeSidebar()">Vision Diagnostics Flow</div>
      <div class="history-group-title">Previous 7 Days</div>
      <div class="history-item" onclick="closeSidebar()">Design System Tokens</div>
    </div>

    <div class="sb-bottom">
      <div class="user-card" onclick="alert('Vektra Pro: Unlimited tokens active')">
        <div class="user-av">V</div>
        <div>
          <div style="font-size:13px;font-weight:600;">Vektra Pro</div>
          <div style="font-size:11px;color:#737373;">Upgrade workspace</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── MAIN CHAT VIEW (Identical to ChatGPT) ── -->
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <!-- Circular Menu Button (=) -->
        <button class="btn-circle" onclick="openSidebar()" title="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/></svg>
        </button>
        <!-- ChatGPT 'Get Plus' Pill -->
        <button class="get-plus-pill" onclick="alert('Vektra Plus Enterprise: Unlimited reasoning unlocked!')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
          Get Plus
        </button>
      </div>
      <!-- Right Circular Compose Button -->
      <button class="btn-circle" onclick="startNewChat()" title="New Chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
    </header>

    <!-- Message Scroller Area -->
    <div class="chat-scroll" id="chatScroller">
      <div class="chat-flow" id="chatFlow">
        <!-- Starter Rows (From Screenshot) -->
        <div class="welcome-starters" id="welcomeStarters">
          <button class="starter-btn" onclick="document.getElementById('hiddenFileInput').click()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Create an image or sticker
          </button>
          <button class="starter-btn" onclick="submitMessage('Write a clean executive summary')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            Write or edit
          </button>
        </div>
        <div class="msg-group" id="messagesList"></div>
      </div>
    </div>

    <!-- Bottom ChatGPT Input Capsule Dock -->
    <div class="dock-wrap">
      <div class="dock-inner">
        <div class="dock-pill">
          <!-- Hidden File Input -->
          <input type="file" id="hiddenFileInput" accept="image/*" style="display:none;" onchange="handleFileSelected(event)"/>
          <!-- '+' Attachment Button -->
          <button class="attach-btn" onclick="document.getElementById('hiddenFileInput').click()" title="Attachment">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <!-- Input -->
          <textarea id="chatInput" rows="1" placeholder="Ask Vektra" oninput="autoGrow(this)" onkeydown="handleKeyDown(event)"></textarea>
          <!-- Microphone Button -->
          <button class="mic-btn" id="micBtn" onclick="toggleDictation()" title="Voice Dictation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <!-- Animated Blue Voice Mode Button -->
          <button class="blue-voice-btn" id="voiceBtn" onclick="openVoiceMode()" title="Live Voice Mode">
            <div class="voice-bars">
              <span class="v-bar"></span><span class="v-bar"></span><span class="v-bar"></span>
            </div>
          </button>
          <!-- Send Arrow Button (appears when typing) -->
          <button class="send-arrow-btn" id="sendBtn" onclick="submitMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ── LIVE VOICE MODE OVERLAY ── -->
<div class="voice-overlay" id="voiceOverlay">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <span style="font-size:12px;font-family:'JetBrains Mono',monospace;color:#8e8ea0;">Vektra Voice Engine · Live</span>
    <button onclick="closeVoiceMode()" style="width:36px;height:36px;border-radius:50%;background:#212121;border:none;color:#fff;cursor:pointer;">✕</button>
  </div>
  <div class="voice-orb"></div>
  <div style="text-align:center;">
    <p style="color:#a3a3a3;font-size:14.5px;">Listening... Speak freely.</p>
  </div>
</div>

<script>
  const API_ENDPOINT = 'https://vektrastudio-bot.onrender.com';
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  const messagesList = document.getElementById('messagesList');
  const chatScroller = document.getElementById('chatScroller');
  let isGenerating = false;

  chatInput.addEventListener('input', () => {
    const hasText = chatInput.value.trim().length > 0;
    sendBtn.style.display = hasText ? 'flex' : 'none';
    micBtn.style.display = hasText ? 'none' : 'flex';
    voiceBtn.style.display = hasText ? 'none' : 'flex';
  });

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitMessage();
    }
  }

  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('drawerBackdrop').classList.add('active');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('drawerBackdrop').classList.remove('active');
  }

  function openVoiceMode() { document.getElementById('voiceOverlay').classList.add('active'); }
  function closeVoiceMode() { document.getElementById('voiceOverlay').classList.remove('active'); }

  function startNewChat() {
    messagesList.innerHTML = '';
    document.getElementById('welcomeStarters').style.display = 'flex';
    closeSidebar();
  }

  function renderMD(text) {
    let out = text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, '<div class="code-card"><div class="code-top"><span>$1</span></div><pre class="code-body"><code>$2</code></pre></div>')
      .replace(/^### (.*$)/gim, '<h4 style="font-size:15px;margin:10px 0 4px;">$1</h4>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:12px;">$1</code>');
    return out;
  }

  async function submitMessage(overrideText) {
    const text = overrideText || chatInput.value.trim();
    if (!text || isGenerating) return;

    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendBtn.style.display = 'none';
    micBtn.style.display = 'flex';
    voiceBtn.style.display = 'flex';
    document.getElementById('welcomeStarters').style.display = 'none';

    // Append User Message
    const userRow = document.createElement('div');
    userRow.className = 'msg-row user';
    userRow.innerHTML = `<div class="user-bubble">${text}</div>`;
    messagesList.appendChild(userRow);

    // Bot Response Container
    const botRow = document.createElement('div');
    botRow.className = 'msg-row bot';
    botRow.innerHTML = `
      <div class="bot-header">
        <div class="bot-logo-sq"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFAAAABQCAYAAACOEfKtAAAYQElEQVR42u18eZRkZZXn797vey+2jMitFlZZtBAoUakqEUGtjCMOUoLoaObgoNIcFVoHRFEOQmtHhqcV2mVcaBdQpFHpGSNbW3tsWsWZyFIbtwIaoVhKEESgqMqsqszY33vfd+/88SKhVGwpKimxzXvOO5GRpzLj1e/97va790tgyZZsyZZsyZZsyZZsyf4cjf4k7lKVKgCtBmj59DQBwMzYmI4DCkCJSJce5eM83FpNTU3V/GF81dRqNbPEwL7VVM0EkV94X7n99vDY/NBh3ieHGaVRFWHKBjspkfujqPmLiec8J+4DSVNTUzwxMeH/LAGsqPLkYy5JtS33nkRsJwzpGCkdls0XjLUWBEDUo9ftqDHmXobe4H3ylVMPPfTGPpA8CaBKJH82AO7Oui/ffs/rwzC8MAzDdUEmgMQRXBwDqsLGCAEgKBGzyWRDZPI59LodqMp34fzlrzj44DoA1Ot1Wx4b83gKYyQ9ncC7+se3PS9bKn0sl8+/TDVB1O0KE4lhMIOIGcRMoP5tE5MSQZVUCDDFUonEJVAvU51ut3LqYYfdCQC1Ws08VW79xwVQlRQgIpJrbtryl5lc/n8G2SDXbTU9E5ExYCICE2D6wDETiNC/GEQAWMEAWNWDiEvDQ5REUVvE/+3PN9384Qs2bIjq9botl8tusf8L/McErzY1xUQkV9+85WP54eHPOhfn2vNND5ABEasCqgpRQHXhx7BQvPwmC4gAZkNM1Jqf8965wkCp9IFjj3vBjd+5//4Ty+WyU1WqqPJ/BgCpMj1tJiYm/Oc23fW5gZHRC9uNeee9V2IYKPWBIywEL9nNXxa+p48682NAEgBmNiKi8zt3uiAM1uRLhY3f3/7IXxMRqkRSr9ftn7QLL8S8T/741g+Mrtz//Z25uYSAwBCDCSAlEBGIFcwEJgUxwxL67/v/bsGdWUFEMAQwEZgIIIBBUFVhwzQ4MkydZqM+Pzv31g1HHHHvYrn0PmdgrVYzE0T+Uz++5ZUDw8Pvb87tdF69VShkwV2p76dKUNG+2yrkd/imv8UEevQNIX0IxhgGgMbOHS6bz5dHVoz+eOO2X7+2XC67iipXKhX+k2GgqtLk5CThlFMGhszA5lw+f6CLespEnCYB7jOIYYj6IADMCmaAmWGYxBIpAUSGiJmIGOA+4wynzOQ+gEQEkIKJoOJ9kAlNEIbodLqXv3TZfpfsbZbepwycnJ421WpVSpp5R2Fo6KCo2/F9B4QoIJA+CwVeBQpJiagE8aoi6o0NOFsomGy+wERMUPHQNMWkmblf5iwERCi4z1ZiMlEUabPZ8tniwHv/37aHrq/dfPPyiYkJ/2TjIu1D+hGItFKrDxSeMXx3JpfdX5NEiZi5X56wpq7HRDB4jIlQSJgJOJPPIWo3HwpY77VsC8bSMQPDg2G7OQ8DeMPGsMGj7AOlzCRKQ4PXNEx4EXjvXX5w0Lba7S2t2bmJM4455ta6qi0TuaclAyvT0wYA+IDCycFA8YAoisUDLPAQFYgohNLqRFXhVaFQePES5nLsRXe2GnNv3dbYfvRrj3zm+tOPOGSdgXtuu9n4bGADXxgoGkC8qucQqHIACAKpwqnAicekfeIvSBR2B07dzgwH5EdKW687u7NG8pErlLZMybuMwBXj41pv3s4XQypU1UvaakipLu5r0IAKBTOewmyOU6S+FedXuPFbzxmVZcuOP74RkWVVZVOOfzwu1/5jIPfHve6J8ZRtLE4PGTEvIh9orEXJE4QO4/IOXjv4ETQ8ykbE4FpNXvSk0SzxdLn/+ZD/+eSPojmiYC4TwCsatg3zxdHV3mig6NeD16VPWVgQeG9V+FFe1WlwCJxSbM5P3fqW9ce89UrN24Kzl17ye7CQB9Ir31GvvyQ       </div>
      <div class="bot-content" id="botContent"><span class="cursor-blink"></span></div>
    `;
    messagesList.appendChild(botRow);
    chatScroller.scrollTop = chatScroller.scrollHeight;
    isGenerating = true;

    try {
      const res = await fetch(API_ENDPOINT + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      typewrite(data.reply || 'Response complete.', botRow.querySelector('#botContent'));
    } catch (_) {
      typewrite(`I received: **"${text}"**.\n\n- **UI Design**: Modeled directly on ChatGPT's mobile structure with pitch black canvas, circular top navigation, and bottom prompt starters.\n- **Render Status**: The backend server is currently spinning up from sleep mode; offline processing is responsive.`, botRow.querySelector('#botContent'));
    }
  }

  function typewrite(fullText, container) {
    let i = 0;
    const interval = setInterval(() => {
      i += 3;
      if (i >= fullText.length) {
        clearInterval(interval);
        container.innerHTML = renderMD(fullText);
        isGenerating = false;
      } else {
        container.innerHTML = renderMD(fullText.slice(0, i)) + '<span class="cursor-blink"></span>';
      }
      chatScroller.scrollTop = chatScroller.scrollHeight;
    }, 22);
  }

  function handleFileSelected(e) {
    const file = e.target.files[0];
    if (file) submitMessage(`[Attached image: ${file.name}] Please inspect.`);
  }

  function toggleDictation() {
    alert('Voice dictation active.');
  }
</script>
